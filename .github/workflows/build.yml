              private Notification buildCompactServiceNotification(String content) {
                  int flags = Build.VERSION.SDK_INT >= 23
                      ? (PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE)
                      : PendingIntent.FLAG_UPDATE_CURRENT;

                  Intent openIntent = new Intent(this, MainActivity.class);
                  PendingIntent openPending = PendingIntent.getActivity(this, 0, openIntent, flags);

                  Intent stopIntent = new Intent(this, BonchBackgroundDaemon.class);
                  stopIntent.putExtra("action", "stop");
                  PendingIntent stopPending = PendingIntent.getService(this, 1, stopIntent, flags);

                  Notification.Builder builder = Build.VERSION.SDK_INT >= 26
                      ? new Notification.Builder(this, CHANNEL_BG)
                      : new Notification.Builder(this);

                  builder.setContentTitle("Bonch AutoCheck")
                         .setContentText(content)
                         .setSmallIcon(android.R.drawable.stat_notify_sync_noanim)
                         .setContentIntent(openPending)
                         .setOngoing(true)
                         .setShowWhen(false);

                  if (Build.VERSION.SDK_INT >= 21) {
                      builder.setCategory(Notification.CATEGORY_SERVICE)
                             .setVisibility(Notification.VISIBILITY_PUBLIC);
                  }

                  Notification.Action stopAction = new Notification.Action.Builder(
                      0, "ОТКЛЮЧИТЬСЯ", stopPending
                  ).build();
                  builder.addAction(stopAction);

                  return builder.build();
              }

              private void sendCheckInAlertNotification(String title, String message) {
                  try {
                      NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm != null) {
                          Notification.Builder builder = Build.VERSION.SDK_INT >= 26
                              ? new Notification.Builder(this, CHANNEL_ALERT)
                              : new Notification.Builder(this);
                          builder.setContentTitle(title)
                                 .setContentText(message)
                                 .setSmallIcon(android.R.drawable.stat_sys_upload_done)
                                 .setAutoCancel(true);
                          nm.notify((int) (System.currentTimeMillis() % 100000), builder.build());
                      }
                  } catch (Exception ignored) {}
              }

              private String httpRequest(String method, String urlStr, String postBody) throws Exception {
                  URL url = new URL(urlStr);
                  HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                  conn.setRequestMethod(method);
                  conn.setConnectTimeout(15000);
                  conn.setReadTimeout(15000);
                  conn.setInstanceFollowRedirects(false);
                  conn.setRequestProperty("User-Agent", "Mozilla/5.0 (Linux; Android 14; Mobile) Chrome/128.0.0.0 Mobile Safari/537.36");
                  conn.setRequestProperty("Referer", LOGIN_PAGE_URL);
                  conn.setRequestProperty("Origin", "https://lk.sut.ru");
                  conn.setRequestProperty("X-Requested-With", "XMLHttpRequest");

                  if ("POST".equals(method)) {
                      conn.setDoOutput(true);
                      conn.setRequestProperty("Content-Type", "application/x-www-form-urlencoded; charset=UTF-8");
                      byte[] out = (postBody != null ? postBody : "").getBytes("UTF-8");
                      try (OutputStream os = conn.getOutputStream()) {
                          os.write(out);
                      }
                  }

                  int code = conn.getResponseCode();
                  if (code >= 300 && code < 400) {
                      conn.disconnect();
                      return "";
                  }

                  InputStream is = code >= 400 ? conn.getErrorStream() : conn.getInputStream();
                  if (is == null) {
                      conn.disconnect();
                      return "";
                  }
                  ByteArrayOutputStream baos = new ByteArrayOutputStream();
                  byte[] buf = new byte[4096];
                  int n;
                  while ((n = is.read(buf)) != -1) {
                      baos.write(buf, 0, n);
                  }
                  conn.disconnect();

                  byte[] bytes = baos.toByteArray();
                  String utf8 = new String(bytes, Charset.forName("UTF-8"));
                  String lower = utf8.toLowerCase(Locale.ROOT);
                  if (lower.contains("расписание") || lower.contains("занят") || lower.contains("присутств") || lower.contains("понедельник") || lower.contains("вторник") || utf8.trim().equals("1")) {
                      return utf8;
                  }
                  String cp1251 = new String(bytes, Charset.forName("windows-1251"));
                  if (cp1251.toLowerCase(Locale.ROOT).contains("расписание") || cp1251.toLowerCase(Locale.ROOT).contains("занят")) {
                      return cp1251;
                  }
                  return utf8;
              }

              private synchronized boolean authenticate(String login, String password) {
                  try {
                      resetCookies();
                      httpRequest("GET", LOGIN_PAGE_URL, null);
                      String data = "users=" + URLEncoder.encode(login, "UTF-8")
                                  + "&parole=" + URLEncoder.encode(password, "UTF-8");
                      String resp = httpRequest("POST", AUTH_URL + "?" + data, data);
                      if (resp.trim().equals("1") || resp.contains("1")) {
                          httpRequest("GET", INI_URL, null);
                          httpRequest("GET", LOGIN_PAGE_URL, null);
                          isAuthenticated = true;
                          addLog("Вход в ЛК выполнен (" + login + ")");
                          saveStateFile();
                          return true;
                      }
                      isAuthenticated = false;
                      addLog("Неверный логин или пароль от lk.sut.ru");
                      saveStateFile();
                      return false;
                  } catch (Exception e) {
                      isAuthenticated = false;
                      resetCookies();
                      addLog("Ошибка сети: " + e.getMessage());
                      saveStateFile();
                      return false;
                  }
              }

              private boolean sendAndVerifyOpenZan(String raspId, String weekId) {
                  try {
                      String payload = "open=1&rasp=" + raspId + "&week=" + weekId;
                      httpRequest("POST", SCHEDULE_URL + "?" + payload, payload);
                      String verifyHtml = httpRequest("POST", SCHEDULE_URL, "").toLowerCase(Locale.ROOT);
                      return verifyHtml.contains("присутств")
                          || verifyHtml.contains("отмечен")
                          || verifyHtml.contains("занятие началось")
                          || !verifyHtml.contains("open_zan(" + raspId);
                  } catch (Exception e) {
                      return false;
                  }
              }

              private static class DayGroup {
                  String header;
                  String dateString;
                  Date dateObj;
                  List<JSONObject> lessons = new ArrayList<>();
                  boolean hasUnfinishedLessons = false;
                  boolean isHighlightedOrange = false;
              }

              private synchronized void pollScheduleAndCheckIn(String login, String password, String currentWindowStart) {
                  if (!isAuthenticated && !authenticate(login, password)) {
                      return;
                  }
                  try {
                      String html = httpRequest("POST", SCHEDULE_URL, "");
                      if (html.trim().length() < 50 || html.toLowerCase(Locale.ROOT).contains("autentification") || !html.toLowerCase(Locale.ROOT).contains("<table")) {
                          if (!authenticate(login, password)) return;
                          html = httpRequest("POST", SCHEDULE_URL, "");
                      }

                      Pattern trPattern = Pattern.compile("<tr([^>]*)>(.*?)</tr>", Pattern.DOTALL | Pattern.CASE_INSENSITIVE);
                      Pattern dayNamePattern = Pattern.compile("(Понедельник|Вторник|Среда|Четверг|Пятница|Суббота|Воскресенье)", Pattern.CASE_INSENSITIVE);
                      Pattern dateValPattern = Pattern.compile("(\\d{2}\\.\\d{2}\\.\\d{4})");
                      Pattern timePattern = Pattern.compile("([01]?\\d|2[0-3])[:.]([0-5]\\d)\\s*[-–—]\\s*([01]?\\d|2[0-3])[:.]([0-5]\\d)");
                      Pattern zanPattern = Pattern.compile("open_zan\\s*\\(\\s*['\"]?(\\d+)['\"]?\\s*,\\s*['\"]?(\\d+)['\"]?\\s*\\)");
                      Pattern startedPattern = Pattern.compile("занятие\\s+началось\\s*(\\d{1,2}[:.]\\d{2})", Pattern.CASE_INSENSITIVE);
                      Pattern waitBtnPattern = Pattern.compile("Кнопка\\s+появится\\s+в\\s*(\\d{1,2}[:.]\\d{2})", Pattern.CASE_INSENSITIVE);
                      Pattern orangeStylePattern = Pattern.compile("(#ff|#f9|#fb|#f8|#fd|#fe|orange|rgb\\s*\\(\\s*255|rgb\\s*\\(\\s*254|rgb\\s*\\(\\s*251|rgb\\s*\\(\\s*249)", Pattern.CASE_INSENSITIVE);

                      Matcher trMatcher = trPattern.matcher(html);
                      List<DayGroup> dayGroups = new ArrayList<>();
                      DayGroup currentGroup = null;
                      SimpleDateFormat df = new SimpleDateFormat("dd.MM.yyyy", Locale.US);
                      List<String> newlyChecked = new ArrayList<>();

                      Calendar nowCal = Calendar.getInstance();
                      int nowMinutesOfDay = nowCal.get(Calendar.HOUR_OF_DAY) * 60 + nowCal.get(Calendar.MINUTE);

                      while (trMatcher.find()) {
                          String trAttrs = trMatcher.group(1);
                          String trInner = trMatcher.group(2);
                          String fullTrHtml = "<tr" + trAttrs + ">" + trInner + "</tr>";

                          String rowText = trInner.replaceAll("<[^>]+>", " ")
                                                  .replaceAll("&nbsp;", " ")
                                                  .replaceAll("\\s+", " ")
                                                  .trim();
                          if (rowText.isEmpty()) continue;

                          Matcher tm = timePattern.matcher(rowText);
                          Matcher dm = dayNamePattern.matcher(rowText);
                          Matcher dateM = dateValPattern.matcher(rowText);

                          if (!tm.find()) {
                              if (dm.find() && rowText.length() < 75) {
                                  currentGroup = new DayGroup();
                                  String dName = dm.group(1);
                                  String dStr = dateM.find() ? dateM.group(1) : null;
                                  currentGroup.dateString = dStr;
                                  currentGroup.header = dStr != null ? (dName + " " + dStr) : dName;
                                  if (dStr != null) {
                                      try {
                                          currentGroup.dateObj = df.parse(dStr);
                                      } catch (Exception ignored) {}
                                  }
                                  dayGroups.add(currentGroup);
                              }
                              continue;
                          }

                          if (currentGroup == null) {
                              currentGroup = new DayGroup();
                              currentGroup.header = "Сегодня";
                              dayGroups.add(currentGroup);
                          }

                          Matcher wm = waitBtnPattern.matcher(rowText);
                          String btnAppearTime = wm.find() ? wm.group(1) : null;

                          if (orangeStylePattern.matcher(fullTrHtml).find() || btnAppearTime != null) {
                              currentGroup.isHighlightedOrange = true;
                          }

                          String timeRange = tm.group(0);
                          int startH = Integer.parseInt(tm.group(1));
                          int startM = Integer.parseInt(tm.group(2));
                          int endH = Integer.parseInt(tm.group(3));
                          int endM = Integer.parseInt(tm.group(4));
                          String startTime = String.format(Locale.US, "%02d:%02d", startH, startM);
                          int endMinutesOfDay = endH * 60 + endM;

                          if (endMinutesOfDay >= nowMinutesOfDay) {
                              currentGroup.hasUnfinishedLessons = true;
                          }

                          ParsedRowDetails structured = extractStructuredLessonInfo(trInner, timeRange);
                          boolean allowedBySmart = isLessonAllowedBySmartFilter(structured.ruleKey);

                          Matcher zm = zanPattern.matcher(fullTrHtml);
                          String raspId = null;
                          String weekId = null;
                          if (zm.find()) {
                              raspId = zm.group(1);
                              weekId = zm.group(2);
                          }

                          Matcher sm = startedPattern.matcher(rowText);
                          String startedAt = sm.find() ? sm.group(1) : null;

                          String lowerRow = rowText.toLowerCase(Locale.ROOT);
                          boolean alreadyInHtml = lowerRow.contains("вы присутствуете")
                                               || lowerRow.contains("отмечен")
                                               || lowerRow.contains("присутствует");

                          // Если пара ВЫКЛЮЧЕНА пользователем в 🤖 Умной отметке — пропускаем её и не шлем запросы
                          if (!allowedBySmart) {
                              if (currentWindowStart != null && currentWindowStart.equals(startTime)) {
                                  completedWindowsToday.add(startTime);
                                  checkInTimeByStart.put(startTime, "пропуск 🤖");
                              }
                          } else if (raspId != null && weekId != null && !alreadyInHtml && !markedRaspIdsToday.contains(raspId)) {
                              if (sendAndVerifyOpenZan(raspId, weekId)) {
                                  String nowStr = new SimpleDateFormat("HH:mm:ss", Locale.getDefault()).format(new Date());
                                  markedRaspIdsToday.add(raspId);
                                  checkInTimeByStart.put(startTime, nowStr);
                                  completedWindowsToday.add(startTime);
                                  alreadyInHtml = true;

                                  newlyChecked.add(structured.subject + " (" + structured.lessonType + ", отметка в " + nowStr + ")");
                              }
                          }

                          boolean hasTimeAppeared = (startedAt != null && raspId == null);
                          boolean isLessonDone = alreadyInHtml
                                              || hasTimeAppeared
                                              || (raspId != null && markedRaspIdsToday.contains(raspId));

                          String displayCheckTime = checkInTimeByStart.get(startTime);
                          if (displayCheckTime == null && startedAt != null) {
                              displayCheckTime = startedAt;
                          }
                          if (isLessonDone && displayCheckTime == null) {
                              displayCheckTime = new SimpleDateFormat("HH:mm", Locale.getDefault()).format(new Date());
                          }

                          if (isLessonDone && currentWindowStart != null && currentWindowStart.equals(startTime)) {
                              completedWindowsToday.add(startTime);
                              if (displayCheckTime != null) {
                                  checkInTimeByStart.put(startTime, displayCheckTime);
                              }
                          }

                          JSONObject item = new JSONObject();
                          item.put("time", timeRange);
                          item.put("startTime", startTime);
                          item.put("subjectTitle", structured.subject);
                          item.put("lessonType", structured.lessonType);
                          item.put("teacher", structured.teacher);
                          item.put("room", structured.room);
                          item.put("ruleKey", structured.ruleKey);
                          item.put("smartAllowed", allowedBySmart);
                          item.put("subject", structured.subject + " • " + structured.lessonType + " (" + structured.teacher + ")");
                          item.put("checked", isLessonDone);
                          item.put("checkTime", displayCheckTime != null ? displayCheckTime : "");
                          item.put("waitBtnTime", btnAppearTime != null ? btnAppearTime : "");
                          currentGroup.lessons.add(item);
                      }

                      JSONArray allDaysJson = new JSONArray();
                      List<DayGroup> nonEmptyGroups = new ArrayList<>();
                      for (DayGroup g : dayGroups) {
                          if (!g.lessons.isEmpty()) {
                              nonEmptyGroups.add(g);
                              JSONObject dayObj = new JSONObject();
                              dayObj.put("title", g.header);
                              dayObj.put("isOrange", g.isHighlightedOrange);
                              dayObj.put("lessons", new JSONArray(g.lessons));
                              allDaysJson.put(dayObj);
                          }
                      }
                      daysWeekArray = allDaysJson;
                      defaultNearestDayIdx = findCurrentOrNearestDayIndex(nonEmptyGroups);

                      if (!nonEmptyGroups.isEmpty()) {
                          DayGroup targetDay = nonEmptyGroups.get(defaultNearestDayIdx);
                          synchronized (parsedTimes) {
                              parsedTimes.clear();
                              for (JSONObject les : targetDay.lessons) {
                                  String st = les.optString("startTime", "");
                                  if (!st.isEmpty()) parsedTimes.add(st);
                              }
                          }
                      }

                      if (!newlyChecked.isEmpty()) {
                          String nowStr = new SimpleDateFormat("HH:mm:ss", Locale.getDefault()).format(new Date());
                          for (String s : newlyChecked) {
                              String title = "✅ Отметился на паре в " + nowStr + "!";
                              addLog(title + " — " + s);
                              sendCheckInAlertNotification(title, s);
                          }
                      } else if (!nonEmptyGroups.isEmpty()) {
                          String activeDayName = nonEmptyGroups.get(defaultNearestDayIdx).header;
                          addLog("Актуальный день: " + activeDayName);
                      }
                      saveStateFile();
                  } catch (Exception e) {
                      isAuthenticated = false;
                      resetCookies();
                      addLog("Сброс сессии и переподключение (" + e.getMessage() + ")");
                      saveStateFile();
                  }
              }

              private int findCurrentOrNearestDayIndex(List<DayGroup> groups) {
                  if (groups.isEmpty()) return 0;

                  for (int i = 0; i < groups.size(); i++) {
                      if (groups.get(i).isHighlightedOrange) return i;
                  }

                  String todayStr = new SimpleDateFormat("dd.MM.yyyy", Locale.US).format(new Date());
                  for (int i = 0; i < groups.size(); i++) {
                      if (todayStr.equals(groups.get(i).dateString)) return i;
                  }

                  Calendar cal = Calendar.getInstance();
                  cal.set(Calendar.HOUR_OF_DAY, 0);
                  cal.set(Calendar.MINUTE, 0);
                  cal.set(Calendar.SECOND, 0);
                  cal.set(Calendar.MILLISECOND, 0);
                  Date todayStart = cal.getTime();

                  for (int i = 0; i < groups.size(); i++) {
                      DayGroup g = groups.get(i);
                      if (g.dateObj != null && !g.dateObj.before(todayStart)) return i;
                  }

                  String[] ruDays = {"Воскресенье", "Понедельник", "Вторник", "Среда", "Четверг", "Пятница", "Суббота"};
                  String todayRuName = ruDays[Calendar.getInstance().get(Calendar.DAY_OF_WEEK) - 1].toLowerCase(Locale.ROOT);
                  for (int i = 0; i < groups.size(); i++) {
                      if (groups.get(i).header.toLowerCase(Locale.ROOT).contains(todayRuName)) return i;
                  }

                  return 0;
              }

              private static class WindowState {
                  String startTime;
                  String label;
              }

              private WindowState getCurrentWindowState(String mode) {
                  int windowMin = "first_30".equals(mode) ? 30 : 95;
                  Set<String> allTimes = new HashSet<>(Arrays.asList(BELL_SCHEDULE));
                  synchronized (parsedTimes) {
                      allTimes.addAll(parsedTimes);
                  }
                  Calendar now = Calendar.getInstance();
                  long nowMillis = now.getTimeInMillis();
                  for (String t : allTimes) {
                      try {
                          String[] parts = t.replace(".", ":").split(":");
                          Calendar start = (Calendar) now.clone();
                          start.set(Calendar.HOUR_OF_DAY, Integer.parseInt(parts[0]));
                          start.set(Calendar.MINUTE, Integer.parseInt(parts[1]));
                          start.set(Calendar.SECOND, 0);
                          double diffMin = (nowMillis - start.getTimeInMillis()) / 60000.0;
                          if (diffMin >= -10.0 && diffMin <= windowMin) {
                              WindowState ws = new WindowState();
                              ws.startTime = String.format(Locale.US, "%02d:%02d", Integer.parseInt(parts[0]), Integer.parseInt(parts[1]));
                              ws.label = diffMin < 0
