                  @JavascriptInterface
                  public String getState() {
                      try {
                          File enabledFlag = new File(getFilesDir(), "daemon_enabled.flag");
                          String raw = readFileAsString("bg_state_010303.json", "");
                          if (raw.isEmpty()) {
                              JSONObject empty = new JSONObject();
                              empty.put("active", enabledFlag.exists());
                              empty.put("status", enabledFlag.exists() ? "Запуск фоновой службы..." : "Отключено");
                              return empty.toString();
                          }
                          JSONObject state = new JSONObject(raw);
                          state.put("active", enabledFlag.exists() && state.optBoolean("active", false));
                          File fDays = new File(getFilesDir(), "semester_days_010303.json");
                          File fCat = new File(getFilesDir(), "smart_catalog_010303.json");
                          File fDiary = new File(getFilesDir(), "diary_recent_010303.json");
                          state.put("daysMtime", fDays.exists() ? fDays.lastModified() : 0L);
                          state.put("catMtime", fCat.exists() ? fCat.lastModified() : 0L);
                          state.put("diaryMtime", fDiary.exists() ? fDiary.lastModified() : 0L);
                          return state.toString();
                      } catch (Exception e) {
                          return "{}";
                      }
                  }

                  @JavascriptInterface
                  public void saveSettingsOnly(String login, String password, String intervalStr, String mode) {
                      writeConfigFile(login, password, intervalStr, mode);
                  }

                  @JavascriptInterface
                  public void toggleAutoCheck(String login, String password, String intervalStr, String mode) {
                      writeConfigFile(login, password, intervalStr, mode);
                      File enabledFlag = new File(getFilesDir(), "daemon_enabled.flag");
                      if (enabledFlag.exists()) {
                          sendDaemonCommand("stop");
                      } else {
                          sendDaemonCommand("start");
                      }
                  }

