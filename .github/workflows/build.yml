                      + "function saveCfg(){AndroidBridge.saveSettingsOnly(val('login'),val('password'),val('interval'),val('mode'));}"
                      + "function toggle(){AndroidBridge.toggleAutoCheck(val('login'),val('password'),val('interval'),val('mode'));setTimeout(poll,400);}"
                      + "function checkNow(){userManuallyChangedDay=false;AndroidBridge.checkNow(val('login'),val('password'),val('interval'),val('mode'));setTimeout(poll,700);}"
                      + "function scanSemester(){AndroidBridge.scanSemesterNow(val('login'),val('password'),val('interval'),val('mode'));setTimeout(poll,500);}"
                      + "function shiftDay(dir){"
                      + "  if(!daysCache.length)return;"
                      + "  userManuallyChangedDay=true;"
                      + "  selectedDayIdx=(selectedDayIdx+dir+daysCache.length)%daysCache.length;"
                      + "  document.getElementById('day_select').value=String(selectedDayIdx);"
                      + "  renderSelectedDay();"
                      + "}"
                      + "function onSelectDay(){"
                      + "  userManuallyChangedDay=true;"
                      + "  selectedDayIdx=parseInt(document.getElementById('day_select').value||'0',10);"
                      + "  renderSelectedDay();"
                      + "}"
                      + "function renderSelectedDay(){"
                      + "  var box=document.getElementById('lessons');"
                      + "  if(!daysCache || !daysCache.length){"
                      + "    box.innerHTML=\"<div style='font-size:12px;color:#94a3b8;'>Нажмите «ВКЛЮЧИТЬ АВТООТМЕТКУ» или «Обновить расписание недели».</div>\";"
                      + "    return;"
                      + "  }"
                      + "  if(selectedDayIdx<0 || selectedDayIdx>=daysCache.length)selectedDayIdx=0;"
                      + "  var dayObj=daysCache[selectedDayIdx];"
                      + "  var list=dayObj.lessons||[];"
                      + "  var h='';"
                      + "  for(var i=0;i<list.length;i++){"
                      + "    var x=list[i];"
                      + "    var allowed=x.ruleKey?isRuleOn(x.ruleKey):true;"
                      + "    var cls=!allowed?'item skip':(x.checked?'item done':'item');"
                      + "    var c=!allowed?'#f87171':(x.checked?'#34d399':'#fb923c');"
                      + "    var waitHint=x.waitBtnTime?(' (кнопка в '+x.waitBtnTime+')'):'';"
                      + "    var st=!allowed?'🚫 Выключено в 🤖 Умной отметке':(x.checked?('✅ Отмечен (время: '+(x.checkTime||'ОК')+')'):('⏳ Ждем кнопку'+waitHint));"
                      + "    h+=\"<div class='\"+cls+\"'><b style='color:\"+c+\"'>\"+x.time+\" — \"+st+\"</b><br>\"+x.subject+\"</div>\";"
                      + "  }"
                      + "  box.innerHTML=h;"
                      + "}"
                      + "function poll(){"
                      + "  try{"
                      + "    var d=JSON.parse(AndroidBridge.getState());"
                      + "    var b=document.getElementById('btn');"
                      + "    var s=document.getElementById('status');"
                      + "    var sb=document.getElementById('status_box');"
                      + "    var u=document.getElementById('uptime');"
                      + "    if(d.active){"
                      + "      b.className='btn on';"
                      + "      b.innerText='ВЫКЛЮЧИТЬ АВТООТМЕТКУ';"
                      + "      sb.className='status-card on';"
                      + "      s.style.color='#34d399';"
                      + "      if(d.startMillis && d.startMillis>0){"
                      + "        var sec=Math.floor((Date.now()-d.startMillis)/1000);"
                      + "        var m=Math.floor(sec/60);var rs=sec%60;"
                      + "        u.innerText='Аптайм: '+m+'м '+rs+'с';"
                      + "      }"
                      + "    }else{"
                      + "      b.className='btn';"
                      + "      b.innerText='ВКЛЮЧИТЬ АВТООТМЕТКУ';"
                      + "      sb.className='status-card';"
                      + "      s.style.color='#94a3b8';"
                      + "      u.innerText='Остановлено';"
                      + "    }"
                      + "    s.innerText=d.scanningSemester?(d.scanStatus||'Анализ семестра...'):(d.status||'Отключено');"
                      + "    if(d.logs)document.getElementById('logs').innerText=d.logs.join('\\n');"
                      + "    if(d.catalog && d.catalog.length){"
                      + "      catalogCache=d.catalog;"
                      + "      var ch=catalogCache.length+'_'+ (d.scanningSemester?'1':'0');"
                      + "      if(ch!==lastCatalogHash){lastCatalogHash=ch;renderSmartCatalog();}"
                      + "    }else if(d.scanningSemester && d.scanStatus){"
                      + "      document.getElementById('smart_stats').innerText='🔄 '+d.scanStatus;"
                      + "    }"
                      + "    if(d.days && d.days.length){"
                      + "      daysCache=d.days;"
                      + "      var defIdx=d.defaultDayIdx||0;"
                      + "      var sel=document.getElementById('day_select');"
                      + "      var opts='';"
                      + "      for(var j=0;j<daysCache.length;j++){"
                      + "        var tag=daysCache[j].isOrange?' 🟠 (Сегодня)':(j===defIdx?' (Ближайший)':'');"
                      + "        opts+=\"<option value='\"+j+\"'>📅 \"+daysCache[j].title+tag+\"</option>\";"
                      + "      }"
                      + "      if(sel.innerHTML!==opts)sel.innerHTML=opts;"
                      + "      if(!userManuallyChangedDay || selectedDayIdx===-1 || lastDefaultIdx!==defIdx){"
                      + "        lastDefaultIdx=defIdx;"
                      + "        selectedDayIdx=defIdx;"
                      + "      }"
                      + "      sel.value=String(selectedDayIdx);"
                      + "      renderSelectedDay();"
                      + "    }"
                      + "  }catch(e){}"
                      + "}"
                      + "initConfig();setInterval(poll,1500);poll();"
                      + "</script></body></html>";
              }
          }
          EOF

          sed -i 's/^[[:space:]]*//' res/values/strings.xml AndroidManifest.xml

          "$BUILD_TOOLS/aapt2" compile --dir res -o build/res.zip
          "$BUILD_TOOLS/aapt2" link -o build/unaligned.apk \
            -I "$ANDROID_JAR" \
            --manifest AndroidManifest.xml \
            --java build/gen \
            build/res.zip

          javac -encoding UTF-8 -source 8 -target 8 \
            -bootclasspath "$ANDROID_JAR" \
            -cp "$ANDROID_JAR" \
            -d build/obj \
            build/gen/ru/sut/bonch/R.java \
            src/ru/sut/bonch/BootReceiver.java \
            src/ru/sut/bonch/BonchBackgroundDaemon.java \
            src/ru/sut/bonch/MainActivity.java

          "$BUILD_TOOLS/d8" --lib "$ANDROID_JAR" --output build/ build/obj/ru/sut/bonch/*.class

          zip -uj build/unaligned.apk build/classes.dex

          "$BUILD_TOOLS/zipalign" -f -p 4 build/unaligned.apk build/aligned.apk

          keytool -genkeypair -v \
            -keystore build/release.keystore \
            -storepass android -keypass android \
            -alias bonchkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=BonchAutoCheck,OU=IT,O=SUT,L=SPb,S=SPb,C=RU"

          "$BUILD_TOOLS/apksigner" sign \
            --ks build/release.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out build/apk/BonchAutoCheck-01.03.00.apk \
            build/aligned.apk

          ls -lh build/apk/BonchAutoCheck-01.03.00.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BonchAutoCheck-01.03.00-APK
          path: build/apk/BonchAutoCheck-01.03.00.apk

      - name: Publish Direct APK to GitHub Releases
        if: always()
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v01.03.00
          name: "Bonch AutoCheck v01.03.00"
          files: build/apk/BonchAutoCheck-01.03.00.apk
