          import org.json.JSONArray;
          import org.json.JSONObject;

          public class MainActivity extends Activity {
              private WebView webView;
              private SharedPreferences prefs;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  prefs = getSharedPreferences("bonch_prefs", Context.MODE_PRIVATE);

                  if (Build.VERSION.SDK_INT >= 33) {
                      try {
                          requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"}, 101);
                      } catch (Exception ignored) {}
                  }

                  // Запрашиваем отключение ограничений батареи, чтобы Android не убивал сервис после закрытия вкладки
                  if (Build.VERSION.SDK_INT >= 23) {
                      try {
                          PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                          if (pm != null && !pm.isIgnoringBatteryOptimizations(getPackageName())) {
                              Intent bi = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS);
                              bi.setData(Uri.parse("package:" + getPackageName()));
                              startActivity(bi);
                          }
                      } catch (Exception ignored) {}
                  }

                  // Если автоотметка была включена до закрытия вкладки — убеждаемся, что сервис работает
                  if (prefs.getBoolean("user_enabled", false) && !BonchForegroundService.active) {
                      sendServiceCommand("start");
                  }

                  webView = new WebView(this);
                  webView.clearCache(true);
                  WebSettings ws = webView.getSettings();
                  ws.setJavaScriptEnabled(true);
                  ws.setDomStorageEnabled(true);
                  ws.setCacheMode(WebSettings.LOAD_NO_CACHE);
                  webView.addJavascriptInterface(new WebBridge(), "AndroidBridge");
                  setContentView(webView);

                  webView.loadDataWithBaseURL("https://lk.sut.ru", buildHtml(), "text/html", "UTF-8", null);
                  if (BonchForegroundService.logs.isEmpty()) {
                      BonchForegroundService.addLog("Версия " + BonchForegroundService.APP_VERSION + " готова. Нажмите кнопку для включения.");
                  }
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  if (webView != null) {
                      webView.evaluateJavascript("if(window.saveCfg){window.saveCfg();}", null);
                  }
              }

              private void sendServiceCommand(String action) {
                  Intent svc = new Intent(MainActivity.this, BonchForegroundService.class);
                  svc.putExtra("action", action);
                  if ("start".equals(action) && Build.VERSION.SDK_INT >= 26) {
                      startForegroundService(svc);
                  } else {
                      startService(svc);
                  }
              }

              public class WebBridge {
                  @JavascriptInterface
                  public String getSavedConfig() {
                      try {
                          JSONObject cfg = new JSONObject();
                          cfg.put("login", prefs.getString("login", ""));
                          cfg.put("password", prefs.getString("password", ""));
                          cfg.put("interval", prefs.getString("interval", "1"));
                          cfg.put("mode", prefs.getString("mode", "full_lesson"));
                          cfg.put("tg_token", prefs.getString("tg_token", ""));
                          cfg.put("tg_chat", prefs.getString("tg_chat", ""));
                          cfg.put("version", BonchForegroundService.APP_VERSION);
                          return cfg.toString();
                      } catch (Exception e) {
                          return "{}";
                      }
                  }

                  @JavascriptInterface
                  public String getState() {
                      try {
                          JSONObject obj = new JSONObject();
                          obj.put("active", BonchForegroundService.active);
                          obj.put("status", BonchForegroundService.statusText);
                          obj.put("dayTitle", BonchForegroundService.nearestDayTitle);
                          obj.put("version", BonchForegroundService.APP_VERSION);
                          synchronized (BonchForegroundService.class) {
                              obj.put("logs", new JSONArray(BonchForegroundService.logs));
                          }
                          obj.put("lessons", BonchForegroundService.lastLessonsJson);
                          return obj.toString();
                      } catch (Exception e) {
                          return "{}";
                      }
                  }

                  @JavascriptInterface
                  public void saveSettingsOnly(String login, String password, String intervalStr, String mode, String tgToken, String tgChat) {
                      savePrefs(login, password, intervalStr, mode, tgToken, tgChat);
                  }

                  @JavascriptInterface
                  public void toggleAutoCheck(String login, String password, String intervalStr, String mode, String tgToken, String tgChat) {
                      savePrefs(login, password, intervalStr, mode, tgToken, tgChat);
                      if (BonchForegroundService.active) {
                          sendServiceCommand("stop");
                      } else {
                          sendServiceCommand("start");
                      }
                  }

                  @JavascriptInterface
                  public void checkNow(String login, String password, String intervalStr, String mode, String tgToken, String tgChat) {
                      savePrefs(login, password, intervalStr, mode, tgToken, tgChat);
                      sendServiceCommand("check_once");
                  }
              }

              private void savePrefs(String login, String pass, String interval, String mode, String tgToken, String tgChat) {
                  prefs.edit()
                       .putString("login", login != null ? login.trim() : "")
                       .putString("password", pass != null ? pass.trim() : "")
                       .putString("interval", (interval != null && !interval.isEmpty()) ? interval : "1")
                       .putString("mode", (mode != null && !mode.isEmpty()) ? mode : "full_lesson")
                       .putString("tg_token", tgToken != null ? tgToken.trim() : "")
                       .putString("tg_chat", tgChat != null ? tgChat.trim() : "")
                       .commit();
              }

