name: Build Bonch APK 01.03.00

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Compile Native Android APK v01.03.00
        shell: bash
        run: |
          set -e
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          ANDROID_JAR=$(ls -d "$SDK_DIR"/platforms/android-* | sort -V | tail -n 1)/android.jar
          BUILD_TOOLS=$(ls -d "$SDK_DIR"/build-tools/* | sort -V | tail -n 1)

          mkdir -p src/ru/sut/bonch res/values build/gen build/obj build/apk

          cat <<-'EOF' > res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Bonch AutoCheck</string>
          </resources>
          EOF

          cat <<-'EOF' > AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="ru.sut.bonch"
              android:versionCode="109"
              android:versionName="01.03.00">

              <uses-sdk android:minSdkVersion="24" android:targetSdkVersion="33" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />

              <application
                  android:label="@string/app_name"
                  android:allowBackup="false"
                  android:usesCleartextTraffic="false"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <service
                      android:name=".BonchBackgroundDaemon"
                      android:process=":bg_daemon"
                      android:enabled="true"
                      android:exported="false"
                      android:stopWithTask="false"
                      android:foregroundServiceType="dataSync" />

                  <receiver
                      android:name=".BootReceiver"
                      android:process=":bg_daemon"
                      android:enabled="true"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                          <action android:name="ru.sut.bonch.WATCHDOG_PING" />
                      </intent-filter>
                  </receiver>

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:excludeFromRecents="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat <<-'EOF' > src/ru/sut/bonch/BootReceiver.java
          package ru.sut.bonch;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          import java.io.File;

          public class BootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  File enabledFlag = new File(context.getFilesDir(), "daemon_enabled.flag");
                  if (enabledFlag.exists()) {
                      Intent svc = new Intent(context, BonchBackgroundDaemon.class);
                      svc.putExtra("action", "start");
                      if (Build.VERSION.SDK_INT >= 26) {
                          context.startForegroundService(svc);
                      } else {
                          context.startService(svc);
                      }
                  }
              }
          }
          EOF

          cat <<-'EOF' > src/ru/sut/bonch/BonchBackgroundDaemon.java
          package ru.sut.bonch;

          import android.app.AlarmManager;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;
          import android.os.SystemClock;
          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.CookieHandler;
          import java.net.CookieManager;
          import java.net.CookiePolicy;
          import java.net.CookieStore;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;
          import java.nio.charset.Charset;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.Calendar;
          import java.util.Date;
          import java.util.HashMap;
          import java.util.HashSet;
          import java.util.LinkedHashMap;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;
          import java.util.Set;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class BonchBackgroundDaemon extends Service {
              public static final String APP_VERSION = "01.03.00";
              private static final int TOTAL_SEMESTER_WEEKS = 18;

              private static final String BASE_URL = "https://lk.sut.ru/cabinet";
              private static final String LOGIN_PAGE_URL = BASE_URL + "/?login=yes";
              private static final String AUTH_URL = BASE_URL + "/lib/autentificationok.php";
              private static final String INI_URL = BASE_URL + "/ini.php";
              private static final String SCHEDULE_URL = BASE_URL + "/project/cabinet/forms/raspisanie.php";

              private static final String CHANNEL_BG = "bonch_compact_service_010300";
              private static final String CHANNEL_ALERT = "bonch_alert_010300";
              private static final int FG_NOTIFICATION_ID = 2007;

              private static final String[] BELL_SCHEDULE = {
                  "09:00", "10:30", "10:45", "13:00", "14:45", "16:30", "18:15", "20:00"
              };

              private PowerManager.WakeLock wakeLock;
              private Thread workerThread;
              private CookieManager cookieManager;

              private volatile boolean active = false;
              private volatile boolean scanningSemester = false;
              private volatile String scanStatusText = "";
              private volatile String statusText = "Отключено";
              private volatile long serviceStartMillis = 0L;
              private final List<String> logs = new ArrayList<>();
              private JSONArray daysWeekArray = new JSONArray();
              private JSONArray smartCatalogArray = new JSONArray();
              private int defaultNearestDayIdx = 0;

              private final Set<String> completedWindowsToday = new HashSet<>();
              private final Set<String> markedRaspIdsToday = new HashSet<>();
              private final Map<String, String> checkInTimeByStart = new HashMap<>();
              private final Set<String> parsedTimes = new HashSet<>();
              private String currentDayStamp = "";

              private volatile boolean isAuthenticated = false;
              private String lastUsedLogin = "";
              private String lastUsedPass = "";

              @Override
              public void onCreate() {
                  super.onCreate();
                  resetCookies();
                  PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                  if (pm != null) {
                      wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "BonchDaemon::SmartServiceLock");
                  }
                  createNotificationChannels();
                  loadPersistedState();
                  loadSmartCatalogFile();
              }

              private synchronized void resetCookies() {
                  try {
                      if (cookieManager != null) {
                          CookieStore store = cookieManager.getCookieStore();
                          if (store != null) {
                              store.removeAll();
                          }
                      }
                      cookieManager = new CookieManager(null, CookiePolicy.ACCEPT_ALL);
                      CookieHandler.setDefault(cookieManager);
                  } catch (Exception ignored) {}
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  JSONObject cfg = readConfigFile();
                  String action = intent != null ? intent.getStringExtra("action") : null;
                  File enabledFlag = new File(getFilesDir(), "daemon_enabled.flag");

                  if (action == null) {
                      action = enabledFlag.exists() ? "start" : "stop";
                  }

                  if ("stop".equals(action)) {
                      if (enabledFlag.exists()) enabledFlag.delete();
                      stopDaemon();
                      return START_NOT_STICKY;
                  }

                  final String login = cfg.optString("login", "").trim();
                  final String pass = cfg.optString("password", "").trim();
                  final String mode = cfg.optString("mode", "full_lesson");

                  if ("scan_semester".equals(action)) {
                      new Thread(new Runnable() {
                          @Override
                          public void run() {
                              if (login.isEmpty() || pass.isEmpty()) {
                                  addLog("Введите логин и пароль для сканирования семестра!");
                                  saveStateFile();
                                  return;
                              }
                              scanFullSemesterSchedule(login, pass);
                          }
                      }).start();
                      return active ? START_STICKY : START_NOT_STICKY;
                  }

                  if ("check_once".equals(action)) {
                      new Thread(new Runnable() {
                          @Override
                          public void run() {
                              if (login.isEmpty() || pass.isEmpty()) {
                                  addLog("Сначала введите логин и пароль!");
                                  saveStateFile();
                                  return;
                              }
                              addLog("Загрузка расписания недели...");
                              saveStateFile();
                              WindowState win = getCurrentWindowState(mode);
                              pollScheduleAndCheckIn(login, pass, win != null ? win.startTime : null);
                              if (smartCatalogArray.length() == 0 && !scanningSemester) {
                                  scanFullSemesterSchedule(login, pass);
                              }
                          }
                      }).start();
                      return active ? START_STICKY : START_NOT_STICKY;
                  }

                  if (login.isEmpty() || pass.isEmpty()) {
                      statusText = "Введите логин и пароль от lk.sut.ru!";
                      addLog(statusText);
                      if (enabledFlag.exists()) enabledFlag.delete();
                      saveStateFile();
                      stopSelf();
                      return START_NOT_STICKY;
                  }

                  try {
                      if (!enabledFlag.exists()) enabledFlag.createNewFile();
                  } catch (Exception ignored) {}

                  if (serviceStartMillis == 0L) {
                      serviceStartMillis = System.currentTimeMillis();
                  }

                  startForeground(FG_NOTIFICATION_ID, buildCompactServiceNotification("Подключено • Умный режим"));
                  scheduleWatchdogAlarm();

                  if (!login.equals(lastUsedLogin) || !pass.equals(lastUsedPass)) {
                      isAuthenticated = false;
                      lastUsedLogin = login;
                      lastUsedPass = pass;
                  }

                  if (!active || workerThread == null || !workerThread.isAlive()) {
                      startWorkerLoop();
                  }
                  saveStateFile();
                  return START_STICKY;
              }

              private void scheduleWatchdogAlarm() {
                  try {
                      Intent restartIntent = new Intent(getApplicationContext(), BootReceiver.class);
                      restartIntent.setAction("ru.sut.bonch.WATCHDOG_PING");
                      int pFlags = Build.VERSION.SDK_INT >= 23
                          ? (PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE)
                          : PendingIntent.FLAG_UPDATE_CURRENT;
                      PendingIntent pi = PendingIntent.getBroadcast(getApplicationContext(), 99, restartIntent, pFlags);
                      AlarmManager am = (AlarmManager) getSystemService(Context.ALARM_SERVICE);
                      if (am != null) {
                          long triggerAt = SystemClock.elapsedRealtime() + 25000L;
                          if (Build.VERSION.SDK_INT >= 23) {
                              am.setExactAndAllowWhileIdle(AlarmManager.ELAPSED_REALTIME_WAKEUP, triggerAt, pi);
                          } else {
                              am.setExact(AlarmManager.ELAPSED_REALTIME_WAKEUP, triggerAt, pi);
                          }
                      }
                  } catch (Exception ignored) {}
              }

              @Override
              public void onTaskRemoved(Intent rootIntent) {
                  File enabledFlag = new File(getFilesDir(), "daemon_enabled.flag");
                  if (enabledFlag.exists()) {
                      addLog("Окно закрыто — служба продолжает работу.");
                      saveStateFile();
                      scheduleWatchdogAlarm();
                  }
                  super.onTaskRemoved(rootIntent);
              }

              @Override
              public void onDestroy() {
                  File enabledFlag = new File(getFilesDir(), "daemon_enabled.flag");
                  if (enabledFlag.exists()) {
                      scheduleWatchdogAlarm();
                  }
                  super.onDestroy();
              }

              private void startWorkerLoop() {
                  active = true;
                  if (wakeLock != null && !wakeLock.isHeld()) {
                      wakeLock.acquire();
                  }

                  workerThread = new Thread(new Runnable() {
                      @Override
                      public void run() {
                          addLog("Служба v" + APP_VERSION + " запущена.");
                          saveStateFile();

                          while (active) {
                              File enabledFlag = new File(getFilesDir(), "daemon_enabled.flag");
                              if (!enabledFlag.exists()) {
                                  break;
                              }

                              scheduleWatchdogAlarm();

                              JSONObject cfg = readConfigFile();
                              String login = cfg.optString("login", "").trim();
                              String password = cfg.optString("password", "").trim();
                              String intervalStr = cfg.optString("interval", "1");
                              String mode = cfg.optString("mode", "full_lesson");

                              double intervalMin = 1.0;
                              try {
                                  intervalMin = Double.parseDouble(intervalStr);
                              } catch (Exception ignored) {}

                              String today = new SimpleDateFormat("dd.MM.yyyy", Locale.US).format(new Date());
                              if (!today.equals(currentDayStamp)) {
                                  currentDayStamp = today;
                                  completedWindowsToday.clear();
                                  markedRaspIdsToday.clear();
                                  checkInTimeByStart.clear();
                              }

                              if (!isAuthenticated) {
                                  updateStatus("Подключение к lk.sut.ru...");
                                  if (!authenticate(login, password)) {
                                      updateStatus("Ошибка входа (проверьте логин/пароль)");
                                      sleepQuietly(20000L);
                                      continue;
                                  }
                                  WindowState initWin = getCurrentWindowState(mode);
                                  pollScheduleAndCheckIn(login, password, initWin != null ? initWin.startTime : null);
                                  // При первом входе автоматически анализируем расписание за полгода
                                  if (smartCatalogArray.length() == 0 && !scanningSemester) {
                                      new Thread(new Runnable() {
                                          @Override
                                          public void run() {
                                              scanFullSemesterSchedule(login, password);
                                          }
                                      }).start();
                                  }
                              }

                              WindowState win = getCurrentWindowState(mode);

                              if (win == null) {
                                  String nextLesson = findNextUnmarkedLessonTime();
                                  if (nextLesson != null) {
                                      updateStatus("Подключено • Ждем пару в " + nextLesson);
                                  } else {
                                      updateStatus("Подключено • Пары на сегодня завершены");
                                  }
                                  sleepQuietly(25000L);
                                  continue;
                              }

                              if (completedWindowsToday.contains(win.startTime)) {
                                  String tMarked = checkInTimeByStart.get(win.startTime);
                                  String nextLesson = findNextLessonAfter(win.startTime);
                                  String waitText = nextLesson != null ? ("Спим до пары в " + nextLesson) : "Спим до след. пары";
                                  updateStatus("✅ Готово (" + (tMarked != null ? tMarked : "ОК") + ") • " + waitText);
                                  sleepQuietly(25000L);
                                  continue;
                              }

                              updateStatus("Ловим кнопку • " + win.label);
                              pollScheduleAndCheckIn(login, password, win.startTime);

                              if (completedWindowsToday.contains(win.startTime)) {
                                  String tMarked = checkInTimeByStart.get(win.startTime);
                                  updateStatus("✅ Готово (" + (tMarked != null ? tMarked : "ОК") + ") • Спим до след. пары");
                                  sleepQuietly(25000L);
                              } else {
                                  sleepQuietly(Math.max(15000L, (long) (intervalMin * 60000L)));
                              }
                          }
                      }
                  });
                  workerThread.start();
              }

              private void stopDaemon() {
                  active = false;
                  serviceStartMillis = 0L;
                  statusText = "Отключено";
                  if (wakeLock != null && wakeLock.isHeld()) {
                      wakeLock.release();
                  }
                  if (workerThread != null) {
                      workerThread.interrupt();
                  }
                  addLog("Автоотметка отключена.");
                  saveStateFile();
                  stopForeground(true);
                  stopSelf();
              }

              private JSONObject readConfigFile() {
                  try {
                      File f = new File(getFilesDir(), "user_config_010300.json");
                      if (!f.exists()) return new JSONObject();
                      ByteArrayOutputStream baos = new ByteArrayOutputStream();
                      try (FileInputStream fis = new FileInputStream(f)) {
                          byte[] buf = new byte[2048];
                          int n;
                          while ((n = fis.read(buf)) != -1) baos.write(buf, 0, n);
                      }
                      return new JSONObject(new String(baos.toByteArray(), "UTF-8"));
                  } catch (Exception e) {
                      return new JSONObject();
                  }
              }

              private JSONObject readSmartRulesMap() {
                  try {
                      File f = new File(getFilesDir(), "smart_rules_010300.json");
                      if (!f.exists()) return new JSONObject();
                      ByteArrayOutputStream baos = new ByteArrayOutputStream();
                      try (FileInputStream fis = new FileInputStream(f)) {
                          byte[] buf = new byte[4096];
                          int n;
                          while ((n = fis.read(buf)) != -1) baos.write(buf, 0, n);
                      }
                      return new JSONObject(new String(baos.toByteArray(), "UTF-8"));
                  } catch (Exception e) {
                      return new JSONObject();
                  }
              }

              private boolean isLessonAllowedBySmartFilter(String ruleKey) {
                  JSONObject rules = readSmartRulesMap();
                  if (!rules.has(ruleKey)) {
                      return true; // По умолчанию галочка включена
                  }
                  return rules.optBoolean(ruleKey, true);
              }

              private synchronized void saveSmartCatalogFile() {
                  try {
                      File f = new File(getFilesDir(), "smart_catalog_010300.json");
                      try (FileOutputStream fos = new FileOutputStream(f)) {
                          fos.write(smartCatalogArray.toString().getBytes("UTF-8"));
                      }
                  } catch (Exception ignored) {}
              }

              private synchronized void loadSmartCatalogFile() {
                  try {
                      File f = new File(getFilesDir(), "smart_catalog_010300.json");
                      if (!f.exists()) return;
                      ByteArrayOutputStream baos = new ByteArrayOutputStream();
                      try (FileInputStream fis = new FileInputStream(f)) {
                          byte[] buf = new byte[4096];
                          int n;
                          while ((n = fis.read(buf)) != -1) baos.write(buf, 0, n);
                      }
                      smartCatalogArray = new JSONArray(new String(baos.toByteArray(), "UTF-8"));
                  } catch (Exception ignored) {}
              }

              private synchronized void saveStateFile() {
                  try {
                      File enabledFlag = new File(getFilesDir(), "daemon_enabled.flag");
                      JSONObject obj = new JSONObject();
                      obj.put("active", active && enabledFlag.exists());
                      obj.put("status", statusText);
                      obj.put("scanningSemester", scanningSemester);
                      obj.put("scanStatus", scanStatusText);
                      obj.put("startMillis", serviceStartMillis);
                      obj.put("defaultDayIdx", defaultNearestDayIdx);
                      obj.put("days", daysWeekArray);
                      obj.put("catalog", smartCatalogArray);
                      obj.put("logs", new JSONArray(logs));
                      File f = new File(getFilesDir(), "bg_state_010300.json");
                      try (FileOutputStream fos = new FileOutputStream(f)) {
                          fos.write(obj.toString().getBytes("UTF-8"));
                      }
                  } catch (Exception ignored) {}
              }

              private synchronized void loadPersistedState() {
                  try {
                      File f = new File(getFilesDir(), "bg_state_010300.json");
                      if (!f.exists()) return;
                      ByteArrayOutputStream baos = new ByteArrayOutputStream();
                      try (FileInputStream fis = new FileInputStream(f)) {
                          byte[] buf = new byte[4096];
                          int n;
                          while ((n = fis.read(buf)) != -1) baos.write(buf, 0, n);
                      }
                      JSONObject obj = new JSONObject(new String(baos.toByteArray(), "UTF-8"));
                      daysWeekArray = obj.optJSONArray("days") != null ? obj.getJSONArray("days") : new JSONArray();
                      defaultNearestDayIdx = obj.optInt("defaultDayIdx", 0);
                      serviceStartMillis = obj.optLong("startMillis", 0L);
                      JSONArray lg = obj.optJSONArray("logs");
                      if (lg != null) {
                          logs.clear();
                          for (int i = 0; i < lg.length(); i++) logs.add(lg.getString(i));
                      }
                  } catch (Exception ignored) {}
              }

              private static class ParsedRowDetails {
                  String subject = "Предмет";
                  String lessonType = "Занятие";
                  String teacher = "Не указан";
                  String room = "";
                  String ruleKey = "";
              }

              // Разбор ячеек <td> строки расписания на Предмет, Тип (Лекция/Практика/Лаба) и Преподавателя
              private ParsedRowDetails extractStructuredLessonInfo(String trInner, String timeRange) {
                  ParsedRowDetails info = new ParsedRowDetails();
                  List<String> tds = new ArrayList<>();
                  Pattern tdPat = Pattern.compile("<td[^>]*>(.*?)</td>", Pattern.DOTALL | Pattern.CASE_INSENSITIVE);
                  Matcher tdMat = tdPat.matcher(trInner);
                  while (tdMat.find()) {
                      tds.add(tdMat.group(1));
                  }

                  String rawSubjectCell = tds.size() >= 2 ? tds.get(1) : trInner;
                  String rawRoomCell = tds.size() >= 3 ? tds.get(2) : "";
                  String rawTeacherCell = tds.size() >= 4 ? tds.get(3) : "";

                  // 1. Определяем тип занятия
                  String cellPlain = rawSubjectCell.replaceAll("<[^>]+>", " ").replaceAll("&nbsp;", " ").replaceAll("\\s+", " ").trim();
                  String lowerCell = cellPlain.toLowerCase(Locale.ROOT);
                  if (lowerCell.contains("лабораторн")) {
                      info.lessonType = "Лабораторная работа";
                  } else if (lowerCell.contains("практическ")) {
                      info.lessonType = "Практические занятия";
                  } else if (lowerCell.contains("лекци")) {
                      info.lessonType = "Лекция";
                  } else if (lowerCell.contains("зачет") || lowerCell.contains("зачёт")) {
                      info.lessonType = "Зачет";
                  } else if (lowerCell.contains("экзамен")) {
                      info.lessonType = "Экзамен";
                  } else if (lowerCell.contains("консультац")) {
                      info.lessonType = "Консультация";
                  } else {
                      info.lessonType = "Занятие";
                  }

                  // 2. Извлекаем чистое название предмета
                  Pattern boldPat = Pattern.compile("<(b|strong)[^>]*>(.*?)</\\1>", Pattern.DOTALL | Pattern.CASE_INSENSITIVE);
                  Matcher boldMat = boldPat.matcher(rawSubjectCell);
                  if (boldMat.find()) {
                      String bText = boldMat.group(2).replaceAll("<[^>]+>", " ").replaceAll("\\s+", " ").trim();
                      if (!bText.isEmpty()) {
                          info.subject = bText;
                      }
                  }
                  if ("Предмет".equals(info.subject)) {
                      String cleaned = cellPlain
                          .replace(timeRange, "")
                          .replaceAll("(?i)(Лабораторная работа|Практические занятия|Лекция|Зачет|Экзамен|Консультация).*", "")
                          .replaceAll("(?i)занятие\\s+началось.*", "")
                          .replaceFirst("^\\s*\\d+\\s*\\(\\s*\\)\\s*", "")
                          .trim();
                      if (!cleaned.isEmpty()) {
                          info.subject = cleaned;
                      }
                  }

                  // 3. Извлекаем ФИО преподавателя
                  String teacherClean = rawTeacherCell.replaceAll("<[^>]+>", " ").replaceAll("&nbsp;", " ").replaceAll("\\s+", " ").trim();
                  if (teacherClean.isEmpty()) {
                      Pattern fioPat = Pattern.compile("([А-ЯЁ][а-яё]+\\s+[А-ЯЁ]\\.\\s*[А-ЯЁ]\\.)");
                      Matcher fioMat = fioPat.matcher(cellPlain);
                      if (fioMat.find()) {
                          teacherClean = fioMat.group(1);
                      }
                  }
                  if (!teacherClean.isEmpty()) {
                      info.teacher = teacherClean;
                  }

                  info.room = rawRoomCell.replaceAll("<[^>]+>", " ").replaceAll("&nbsp;", " ").replaceAll("\\s+", " ").trim();
                  info.ruleKey = info.subject + "||" + info.lessonType + "||" + info.teacher;
                  return info;
              }

              // Анализатор расписания за полгода (проходит недели семестра 1..18 на lk.sut.ru)
              private void scanFullSemesterSchedule(String login, String password) {
                  if (scanningSemester) return;
                  scanningSemester = true;
                  scanStatusText = "Начинаем анализ расписания за полгода (18 недель)...";
                  addLog("🤖 Запуск анализа расписания за полгода...");
                  saveStateFile();

                  try {
                      if (!isAuthenticated && !authenticate(login, password)) {
                          scanningSemester = false;
                          scanStatusText = "Ошибка входа в ЛК";
                          saveStateFile();
                          return;
                      }

                      Pattern trPattern = Pattern.compile("<tr([^>]*)>(.*?)</tr>", Pattern.DOTALL | Pattern.CASE_INSENSITIVE);
                      Pattern timePattern = Pattern.compile("([01]?\\d|2[0-3])[:.]([0-5]\\d)\\s*[-–—]\\s*([01]?\\d|2[0-3])[:.]([0-5]\\d)");

                      Map<String, JSONObject> catalogMap = new LinkedHashMap<>();

                      for (int week = 1; week <= TOTAL_SEMESTER_WEEKS; week++) {
                          scanStatusText = "Анализ семестра: неделя " + week + " из " + TOTAL_SEMESTER_WEEKS + "...";
                          saveStateFile();

                          String payload = "week=" + week;
                          String html = httpRequest("POST", SCHEDULE_URL + "?" + payload, payload);
                          if (html.isEmpty() || !html.toLowerCase(Locale.ROOT).contains("<table")) {
                              continue;
                          }

                          Matcher trMatcher = trPattern.matcher(html);
                          while (trMatcher.find()) {
                              String trInner = trMatcher.group(2);
                              String rowText = trInner.replaceAll("<[^>]+>", " ").replaceAll("&nbsp;", " ").replaceAll("\\s+", " ").trim();
                              if (rowText.isEmpty()) continue;

                              Matcher tm = timePattern.matcher(rowText);
                              if (!tm.find()) continue;

                              ParsedRowDetails det = extractStructuredLessonInfo(trInner, tm.group(0));
                              JSONObject existing = catalogMap.get(det.ruleKey);
                              if (existing == null) {
                                  existing = new JSONObject();
                                  existing.put("key", det.ruleKey);
                                  existing.put("subject", det.subject);
                                  existing.put("type", det.lessonType);
                                  existing.put("teacher", det.teacher);
                                  existing.put("count", 1);
                                  catalogMap.put(det.ruleKey, existing);
                              } else {
                                  existing.put("count", existing.optInt("count", 1) + 1);
                              }
                          }
                      }

                      // Если по параметру week=N вуз отдал пустоту, берем данные из текущей загруженной недели
                      if (catalogMap.isEmpty() && daysWeekArray.length() > 0) {
                          for (int d = 0; d < daysWeekArray.length(); d++) {
                              JSONObject dayObj = daysWeekArray.optJSONObject(d);
                              if (dayObj == null) continue;
                              JSONArray lesArr = dayObj.optJSONArray("lessons");
                              if (lesArr == null) continue;
                              for (int l = 0; l < lesArr.length(); l++) {
                                  JSONObject les = lesArr.optJSONObject(l);
                                  if (les == null) continue;
                                  String key = les.optString("ruleKey", "");
                                  if (key.isEmpty()) continue;
                                  JSONObject existing = catalogMap.get(key);
                                  if (existing == null) {
                                      existing = new JSONObject();
                                      existing.put("key", key);
                                      existing.put("subject", les.optString("subjectTitle", "Предмет"));
                                      existing.put("type", les.optString("lessonType", "Занятие"));
                                      existing.put("teacher", les.optString("teacher", "Не указан"));
                                      existing.put("count", 1);
                                      catalogMap.put(key, existing);
                                  } else {
                                      existing.put("count", existing.optInt("count", 1) + 1);
                                  }
                              }
                          }
                      }

                      JSONArray newCatalog = new JSONArray();
                      for (JSONObject item : catalogMap.values()) {
                          newCatalog.put(item);
                      }
                      smartCatalogArray = newCatalog;
                      saveSmartCatalogFile();

                      scanStatusText = "Проанализировано за полгода: записей " + newCatalog.length();
                      addLog("🤖 Анализ полгода завершен! Найдено видов занятий: " + newCatalog.length());
                  } catch (Exception e) {
                      scanStatusText = "Ошибка анализа: " + e.getMessage();
                      addLog("Ошибка анализа семестра: " + e.getMessage());
                  } finally {
                      scanningSemester = false;
                      saveStateFile();
                  }
              }

              private String findNextUnmarkedLessonTime() {
                  Calendar now = Calendar.getInstance();
                  int nowMins = now.get(Calendar.HOUR_OF_DAY) * 60 + now.get(Calendar.MINUTE);
                  Set<String> times = new HashSet<>(Arrays.asList(BELL_SCHEDULE));
                  synchronized (parsedTimes) {
                      times.addAll(parsedTimes);
                  }
                  String[] sorted = times.toArray(new String[0]);
                  Arrays.sort(sorted);
                  for (String t : sorted) {
                      if (completedWindowsToday.contains(t)) continue;
                      try {
                          String[] p = t.split(":");
                          int m = Integer.parseInt(p[0]) * 60 + Integer.parseInt(p[1]);
                          if (m > nowMins - 10) return t;
                      } catch (Exception ignored) {}
                  }
                  return null;
              }

              private String findNextLessonAfter(String currentStart) {
                  Set<String> times = new HashSet<>(Arrays.asList(BELL_SCHEDULE));
                  synchronized (parsedTimes) {
                      times.addAll(parsedTimes);
                  }
                  String[] sorted = times.toArray(new String[0]);
                  Arrays.sort(sorted);
                  for (String t : sorted) {
                      if (t.compareTo(currentStart) > 0) return t;
                  }
                  return null;
              }

