name: Build Bonch APK 01.02

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Compile Native Android APK v01.02
        run: |
          set -e
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          ANDROID_JAR=$(ls -d "$SDK_DIR"/platforms/android-* | sort -V | tail -n 1)/android.jar
          BUILD_TOOLS=$(ls -d "$SDK_DIR"/build-tools/* | sort -V | tail -n 1)

          mkdir -p src/ru/sut/bonch res/values build/gen build/obj build/apk

          cat << 'EOF' > res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Bonch AutoCheck</string>
          </resources>
          EOF

          cat << 'EOF' > AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="ru.sut.bonch"
              android:versionCode="103"
              android:versionName="01.02">

              <uses-sdk android:minSdkVersion="24" android:targetSdkVersion="33" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />

              <application
                  android:label="@string/app_name"
                  android:allowBackup="false"
                  android:usesCleartextTraffic="false"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <service
                      android:name=".BonchForegroundService"
                      android:enabled="true"
                      android:exported="false"
                      android:stopWithTask="false"
                      android:foregroundServiceType="dataSync" />

                  <receiver
                      android:name=".BootReceiver"
                      android:enabled="true"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="ru.sut.bonch.RESTART_SERVICE" />
                      </intent-filter>
                  </receiver>

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > src/ru/sut/bonch/BootReceiver.java
          package ru.sut.bonch;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Build;

          public class BootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  SharedPreferences prefs = context.getSharedPreferences("bonch_prefs", Context.MODE_PRIVATE);
                  boolean wasEnabled = prefs.getBoolean("user_enabled", false);
                  String login = prefs.getString("login", "").trim();
                  String pass = prefs.getString("password", "").trim();
                  if (wasEnabled && !login.isEmpty() && !pass.isEmpty()) {
                      Intent svc = new Intent(context, BonchForegroundService.class);
                      svc.putExtra("action", "start");
                      if (Build.VERSION.SDK_INT >= 26) {
                          context.startForegroundService(svc);
                      } else {
                          context.startService(svc);
                      }
                  }
              }
          }
          EOF

          cat << 'EOF' > src/ru/sut/bonch/BonchForegroundService.java
          package ru.sut.bonch;

          import android.app.AlarmManager;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;
          import android.os.SystemClock;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.CookieHandler;
          import java.net.CookieManager;
          import java.net.CookiePolicy;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;
          import java.nio.charset.Charset;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.Calendar;
          import java.util.Date;
          import java.util.HashMap;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;
          import java.util.Set;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class BonchForegroundService extends Service {
              public static final String APP_VERSION = "01.02";

              private static final String BASE_URL = "https://lk.sut.ru/cabinet";
              private static final String LOGIN_PAGE_URL = BASE_URL + "/?login=yes";
              private static final String AUTH_URL = BASE_URL + "/lib/autentificationok.php";
              private static final String INI_URL = BASE_URL + "/ini.php";
              private static final String SCHEDULE_URL = BASE_URL + "/project/cabinet/forms/raspisanie.php";

              private static final String CHANNEL_BG = "bonch_bg_channel_0102";
              private static final String CHANNEL_ALERT = "bonch_alert_channel_0102";
              private static final int FG_NOTIFICATION_ID = 1002;

              private static final String[] BELL_SCHEDULE = {
                  "09:00", "10:30", "10:45", "13:00", "14:45", "16:30", "18:15", "20:00"
              };

              public static volatile boolean active = false;
              public static volatile String statusText = "Отключено";
              public static volatile String nearestDayTitle = "Ближайший учебный день";
              public static final List<String> logs = new ArrayList<>();
              public static JSONArray lastLessonsJson = new JSONArray();

              private static final Set<String> completedWindowsToday = new HashSet<>();
              private static final Set<String> markedRaspIdsToday = new HashSet<>();
              private static final Map<String, String> checkInTimeByStart = new HashMap<>();
              private static final Set<String> parsedTimes = new HashSet<>();
              private static String currentDayStamp = "";

              private PowerManager.WakeLock wakeLock;
              private Thread workerThread;
              private volatile boolean isAuthenticated = false;
              private String lastUsedLogin = "";
              private String lastUsedPass = "";

              @Override
              public void onCreate() {
                  super.onCreate();
                  if (CookieHandler.getDefault() == null) {
                      CookieHandler.setDefault(new CookieManager(null, CookiePolicy.ACCEPT_ALL));
                  }
                  PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                  if (pm != null) {
                      wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "BonchAutoCheck::VpnWakeLock");
                  }
                  createNotificationChannels();
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  final SharedPreferences prefs = getSharedPreferences("bonch_prefs", Context.MODE_PRIVATE);
                  String action = intent != null ? intent.getStringExtra("action") : null;
                  if (action == null) {
                      action = prefs.getBoolean("user_enabled", false) ? "start" : "stop";
                  }

                  if ("stop".equals(action)) {
                      prefs.edit().putBoolean("user_enabled", false).commit();
                      stopWorkerAndService();
                      return START_NOT_STICKY;
                  }

                  final String login = prefs.getString("login", "").trim();
                  final String pass = prefs.getString("password", "").trim();

                  if ("check_once".equals(action)) {
                      new Thread(new Runnable() {
                          @Override
                          public void run() {
                              if (login.isEmpty() || pass.isEmpty()) {
                                  addLog("Сначала введите логин и пароль!");
                                  return;
                              }
                              addLog("Обновление расписания на ближайший день...");
                              WindowState win = getCurrentWindowState(prefs.getString("mode", "full_lesson"));
                              pollScheduleAndCheckIn(login, pass, win != null ? win.startTime : null);
                          }
                      }).start();
                      return active ? START_STICKY : START_NOT_STICKY;
                  }

                  if (login.isEmpty() || pass.isEmpty()) {
                      statusText = "Введите логин и пароль от lk.sut.ru!";
                      addLog(statusText);
                      prefs.edit().putBoolean("user_enabled", false).commit();
                      stopSelf();
                      return START_NOT_STICKY;
                  }

                  prefs.edit().putBoolean("user_enabled", true).commit();
                  startForeground(FG_NOTIFICATION_ID, buildForegroundNotification("Работает в фоне (как VPN)..."));

                  if (!login.equals(lastUsedLogin) || !pass.equals(lastUsedPass)) {
                      isAuthenticated = false;
                      lastUsedLogin = login;
                      lastUsedPass = pass;
                  }

                  if (!active || workerThread == null || !workerThread.isAlive()) {
                      startWorkerLoop();
                  }
                  return START_STICKY;
              }

              // Срабатывает, когда пользователь смахивает (закрывает) вкладку приложения из недавних
              @Override
              public void onTaskRemoved(Intent rootIntent) {
                  SharedPreferences prefs = getSharedPreferences("bonch_prefs", Context.MODE_PRIVATE);
                  if (prefs.getBoolean("user_enabled", false)) {
                      Intent restartIntent = new Intent(getApplicationContext(), BonchForegroundService.class);
                      restartIntent.setPackage(getPackageName());
                      restartIntent.putExtra("action", "start");
                      int flags = Build.VERSION.SDK_INT >= 23
                          ? (PendingIntent.FLAG_ONE_SHOT | PendingIntent.FLAG_IMMUTABLE)
                          : PendingIntent.FLAG_ONE_SHOT;
                      PendingIntent pi = PendingIntent.getService(getApplicationContext(), 1, restartIntent, flags);
                      AlarmManager am = (AlarmManager) getSystemService(Context.ALARM_SERVICE);
                      if (am != null) {
                          am.set(AlarmManager.ELAPSED_REALTIME, SystemClock.elapsedRealtime() + 1000L, pi);
                      }
                  }
                  super.onTaskRemoved(rootIntent);
              }

              private void startWorkerLoop() {
                  active = true;
                  if (wakeLock != null && !wakeLock.isHeld()) {
                      wakeLock.acquire();
                  }

                  workerThread = new Thread(new Runnable() {
                      @Override
                      public void run() {
                          addLog("Автоотметка ВКЛЮЧЕНА (работает даже при закрытии вкладки).");
                          while (active) {
                              SharedPreferences prefs = getSharedPreferences("bonch_prefs", Context.MODE_PRIVATE);
                              if (!prefs.getBoolean("user_enabled", false)) {
                                  break;
                              }

                              String login = prefs.getString("login", "").trim();
                              String password = prefs.getString("password", "").trim();
                              String intervalStr = prefs.getString("interval", "1");
                              String mode = prefs.getString("mode", "full_lesson");

                              double intervalMin = 1.0;
                              try {
                                  intervalMin = Double.parseDouble(intervalStr);
                              } catch (Exception ignored) {}

                              String today = new SimpleDateFormat("dd.MM.yyyy", Locale.US).format(new Date());
                              if (!today.equals(currentDayStamp)) {
                                  currentDayStamp = today;
                                  completedWindowsToday.clear();
                                  markedRaspIdsToday.clear();
                                  checkInTimeByStart.clear();
                              }

                              if (!isAuthenticated) {
                                  updateStatus("Подключение к lk.sut.ru...");
                                  if (!authenticate(login, password)) {
                                      updateStatus("Ошибка входа (проверьте логин/пароль)");
                                      sleepQuietly(20000L);
                                      continue;
                                  }
                                  WindowState initWin = getCurrentWindowState(mode);
                                  pollScheduleAndCheckIn(login, password, initWin != null ? initWin.startTime : null);
                              }

                              WindowState win = getCurrentWindowState(mode);

                              // 1. Вне времени пары не шлем лишних запросов
                              if (win == null) {
                                  String nextLesson = findNextUnmarkedLessonTime();
                                  if (nextLesson != null) {
                                      updateStatus("В фоне • Ждем пару в " + nextLesson);
                                  } else {
                                      updateStatus("В фоне • Ждем следующую пару");
                                  }
                                  sleepQuietly(30000L);
                                  continue;
                              }

                              // 2. Если на этой паре уже отмечены (или появилось время начала) — НИЧЕГО не отправляем до следующей пары!
                              if (completedWindowsToday.contains(win.startTime)) {
                                  String tMarked = checkInTimeByStart.get(win.startTime);
                                  String nextLesson = findNextLessonAfter(win.startTime);
                                  String waitText = nextLesson != null ? ("Спим до пары в " + nextLesson) : "Спим до следующей пары";
                                  updateStatus("✅ Отмечен (" + (tMarked != null ? tMarked : "ОК") + ") • " + waitText);
                                  sleepQuietly(30000L);
                                  continue;
                              }

                              // 3. Опрашиваем ЛК, пока не появится кнопка или время отметки
                              updateStatus("Активно • " + win.label);
                              pollScheduleAndCheckIn(login, password, win.startTime);

                              if (completedWindowsToday.contains(win.startTime)) {
                                  String tMarked = checkInTimeByStart.get(win.startTime);
                                  updateStatus("✅ Отмечен (" + (tMarked != null ? tMarked : "ОК") + ") • Спим до след. пары");
                                  sleepQuietly(30000L);
                              } else {
                                  sleepQuietly(Math.max(15000L, (long) (intervalMin * 60000L)));
                              }
                          }
                      }
                  });
                  workerThread.start();
              }

              private void stopWorkerAndService() {
                  active = false;
                  statusText = "Отключено";
                  if (wakeLock != null && wakeLock.isHeld()) {
                      wakeLock.release();
                  }
                  if (workerThread != null) {
                      workerThread.interrupt();
                  }
                  addLog("Автоотметка ВЫКЛЮЧЕНА пользователем.");
                  stopForeground(true);
                  stopSelf();
              }

              private String findNextUnmarkedLessonTime() {
                  Calendar now = Calendar.getInstance();
                  int nowMins = now.get(Calendar.HOUR_OF_DAY) * 60 + now.get(Calendar.MINUTE);
                  Set<String> times = new HashSet<>(Arrays.asList(BELL_SCHEDULE));
                  synchronized (parsedTimes) {
                      times.addAll(parsedTimes);
                  }
                  String[] sorted = times.toArray(new String[0]);
                  Arrays.sort(sorted);
                  for (String t : sorted) {
                      if (completedWindowsToday.contains(t)) continue;
                      try {
                          String[] p = t.split(":");
                          int m = Integer.parseInt(p[0]) * 60 + Integer.parseInt(p[1]);
                          if (m > nowMins - 10) return t;
                      } catch (Exception ignored) {}
                  }
                  return null;
              }

              private String findNextLessonAfter(String currentStart) {
                  Set<String> times = new HashSet<>(Arrays.asList(BELL_SCHEDULE));
                  synchronized (parsedTimes) {
                      times.addAll(parsedTimes);
                  }
                  String[] sorted = times.toArray(new String[0]);
                  Arrays.sort(sorted);
                  for (String t : sorted) {
                      if (t.compareTo(currentStart) > 0) return t;
                  }
                  return null;
              }

              private void sleepQuietly(long ms) {
                  try {
                      Thread.sleep(ms);
                  } catch (InterruptedException ignored) {}
              }

              private void updateStatus(String newStatus) {
                  statusText = newStatus;
                  if (active) {
                      NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm != null) {
                          nm.notify(FG_NOTIFICATION_ID, buildForegroundNotification(newStatus));
                      }
                  }
              }

              public static synchronized void addLog(String msg) {
                  String stamp = new Simple
