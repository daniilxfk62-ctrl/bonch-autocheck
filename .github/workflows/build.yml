                      try {
                          PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                          if (pm != null && !pm.isIgnoringBatteryOptimizations(getPackageName())) {
                              Intent bi = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS);
                              bi.setData(Uri.parse("package:" + getPackageName()));
                              startActivity(bi);
                          }
                      } catch (Exception ignored) {}
                  }

                  webView = new WebView(this);
                  webView.clearCache(true);
                  WebSettings ws = webView.getSettings();
                  ws.setJavaScriptEnabled(true);
                  ws.setDomStorageEnabled(true);
                  ws.setCacheMode(WebSettings.LOAD_NO_CACHE);
                  webView.addJavascriptInterface(new WebBridge(), "AndroidBridge");
                  setContentView(webView);

                  webView.loadDataWithBaseURL("https://lk.sut.ru", buildHtml(), "text/html", "UTF-8", null);
              }

              private void sendDaemonCommand(String action) {
                  Intent svc = new Intent(MainActivity.this, BonchBackgroundDaemon.class);
                  svc.putExtra("action", action);
                  if ("start".equals(action) && Build.VERSION.SDK_INT >= 26) {
                      startForegroundService(svc);
                  } else {
                      startService(svc);
                  }
              }

              public class WebBridge {
                  @JavascriptInterface
                  public String getSavedConfig() {
                      try {
                          File f = new File(getFilesDir(), "user_config_010300.json");
                          if (!f.exists()) {
                              JSONObject def = new JSONObject();
                              def.put("interval", "1");
                              def.put("mode", "full_lesson");
                              return def.toString();
                          }
                          ByteArrayOutputStream baos = new ByteArrayOutputStream();
                          try (FileInputStream fis = new FileInputStream(f)) {
                              byte[] buf = new byte[2048];
                              int n;
                              while ((n = fis.read(buf)) != -1) baos.write(buf, 0, n);
                          }
                          return new String(baos.toByteArray(), "UTF-8");
                      } catch (Exception e) {
                          return "{}";
                      }
                  }

                  @JavascriptInterface
                  public String getSmartRules() {
                      try {
                          File f = new File(getFilesDir(), "smart_rules_010300.json");
                          if (!f.exists()) return "{}";
                          ByteArrayOutputStream baos = new ByteArrayOutputStream();
                          try (FileInputStream fis = new FileInputStream(f)) {
                              byte[] buf = new byte[4096];
                              int n;
                              while ((n = fis.read(buf)) != -1) baos.write(buf, 0, n);
                          }
                          return new String(baos.toByteArray(), "UTF-8");
                      } catch (Exception e) {
                          return "{}";
                      }
                  }

                  @JavascriptInterface
                  public void saveSmartRules(String rulesJsonStr) {
                      try {
                          File f = new File(getFilesDir(), "smart_rules_010300.json");
                          try (FileOutputStream fos = new FileOutputStream(f)) {
                              fos.write((rulesJsonStr != null ? rulesJsonStr : "{}").getBytes("UTF-8"));
                          }
                      } catch (Exception ignored) {}
                  }

                  @JavascriptInterface
                  public String getState() {
                      try {
                          File enabledFlag = new File(getFilesDir(), "daemon_enabled.flag");
                          File f = new File(getFilesDir(), "bg_state_010300.json");
                          if (!f.exists()) {
                              JSONObject empty = new JSONObject();
                              empty.put("active", enabledFlag.exists());
                              empty.put("status", enabledFlag.exists() ? "Запуск фоновой службы..." : "Отключено");
                              return empty.toString();
                          }
                          ByteArrayOutputStream baos = new ByteArrayOutputStream();
                          try (FileInputStream fis = new FileInputStream(f)) {
                              byte[] buf = new byte[4096];
                              int n;
                              while ((n = fis.read(buf)) != -1) baos.write(buf, 0, n);
                          }
                          JSONObject state = new JSONObject(new String(baos.toByteArray(), "UTF-8"));
                          state.put("active", enabledFlag.exists() && state.optBoolean("active", false));
                          return state.toString();
                      } catch (Exception e) {
                          return "{}";
                      }
                  }

                  @JavascriptInterface
                  public void saveSettingsOnly(String login, String password, String intervalStr, String mode) {
                      writeConfigFile(login, password, intervalStr, mode);
                  }

                  @JavascriptInterface
                  public void toggleAutoCheck(String login, String password, String intervalStr, String mode) {
                      writeConfigFile(login, password, intervalStr, mode);
                      File enabledFlag = new File(getFilesDir(), "daemon_enabled.flag");
                      if (enabledFlag.exists()) {
                          sendDaemonCommand("stop");
                      } else {
                          sendDaemonCommand("start");
                      }
                  }

                  @JavascriptInterface
                  public void checkNow(String login, String password, String intervalStr, String mode) {
                      writeConfigFile(login, password, intervalStr, mode);
                      sendDaemonCommand("check_once");
                  }

                  @JavascriptInterface
                  public void scanSemesterNow(String login, String password, String intervalStr, String mode) {
                      writeConfigFile(login, password, intervalStr, mode);
                      sendDaemonCommand("scan_semester");
                  }

                  @JavascriptInterface
                  public void hideToBackground() {
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              if (Build.VERSION.SDK_INT >= 21) {
                                  finishAndRemoveTask();
                              } else {
                                  finish();
                              }
                          }
                      });
                  }
              }

              private synchronized void writeConfigFile(String login, String pass, String interval, String mode) {
                  try {
                      JSONObject cfg = new JSONObject();
                      cfg.put("login", login != null ? login.trim() : "");
                      cfg.put("password", pass != null ? pass.trim() : "");
                      cfg.put("interval", (interval != null && !interval.isEmpty()) ? interval : "1");
                      cfg.put("mode", (mode != null && !mode.isEmpty()) ? mode : "full_lesson");
                      File f = new File(getFilesDir(), "user_config_010300.json");
                      try (FileOutputStream fos = new FileOutputStream(f)) {
                          fos.write(cfg.toString().getBytes("UTF-8"));
                      }
                  } catch (Exception ignored) {}
              }

