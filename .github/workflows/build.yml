name: Build Bonch APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Flutter 3.22.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.3"
          channel: "stable"

      - name: Accept Android Licenses and Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev
          yes | flutter doctor --android-licenses

      - name: Prepare clean requirements.txt
        run: |
          cat << 'EOF' > requirements.txt
          flet==0.24.1
          requests
          beautifulsoup4
          EOF

      - name: Install Flet and dependencies
        run: |
          pip install --upgrade pip
          pip install "flet==0.24.1" requests beautifulsoup4

      - name: Build APK
        run: |
          flet build apk --project "BonchAutoCheck" --description "Auto check-in for lk.sut.ru" --verbose

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BonchAutoCheck-APK
          path: build/apk/*.apk
