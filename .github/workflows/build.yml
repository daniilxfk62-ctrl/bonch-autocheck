name: Build Modular Bonch APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Compile APK from Repository Files
        id: compile
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ ! -f "$SDK_DIR/platforms/android-35/android.jar" ]; then
            yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          fi
          ANDROID_JAR="$SDK_DIR/platforms/android-35/android.jar"
          BUILD_TOOLS=$(ls -d "$SDK_DIR"/build-tools/35.* "$SDK_DIR"/build-tools/* 2>/dev/null | sort -V | tail -n 1)

          APP_VER=$(grep -oP 'versionName="\K[^"]+' AndroidManifest.xml || echo "01.04.02")
          echo "version=$APP_VER" >> "$GITHUB_OUTPUT"

          mkdir -p build/gen build/obj build/apk
          sed -i 's/^[[:space:]]*//' res/values/strings.xml AndroidManifest.xml

          "$BUILD_TOOLS/aapt2" compile --dir res -o build/res.zip
          "$BUILD_TOOLS/aapt2" link -o build/unaligned.apk \
            -I "$ANDROID_JAR" \
            --manifest AndroidManifest.xml \
            --min-sdk-version 24 \
            --target-sdk-version 35 \
            -A assets \
            --java build/gen \
            build/res.zip

          javac -encoding UTF-8 -source 8 -target 8 \
            -bootclasspath "$ANDROID_JAR" \
            -cp "$ANDROID_JAR" \
            -d build/obj \
            build/gen/ru/sut/bonch/R.java \
            src/ru/sut/bonch/*.java

          "$BUILD_TOOLS/d8" --lib "$ANDROID_JAR" --output build/ build/obj/ru/sut/bonch/*.class
          zip -uj build/unaligned.apk build/classes.dex
          "$BUILD_TOOLS/zipalign" -f -p 4 build/unaligned.apk build/aligned.apk

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing!" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > build/release.keystore

          "$BUILD_TOOLS/apksigner" sign \
            --ks build/release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "env:KEYSTORE_PASSWORD" \
            --key-pass "env:KEY_PASSWORD" \
            --out "build/apk/BonchAutoCheck-${APP_VER}.apk" \
            build/aligned.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BonchAutoCheck-${{ steps.compile.outputs.version }}-APK
          path: build/apk/BonchAutoCheck-${{ steps.compile.outputs.version }}.apk

      - name: Publish Direct APK to GitHub Releases
        if: always()
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.compile.outputs.version }}
          name: "Bonch AutoCheck v${{ steps.compile.outputs.version }}"
          files: build/apk/BonchAutoCheck-${{ steps.compile.outputs.version }}.apk
