          sed -i 's/^[[:space:]]*//' res/values/strings.xml AndroidManifest.xml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add AndroidManifest.xml src/ assets/
          if ! git diff --cached --quiet; then
            git commit -m "Update modular files to v01.04.01 [skip ci]" || true
            git push origin HEAD:main || git push || true
