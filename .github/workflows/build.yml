name: Build Modular Bonch APK 01.04.00

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Compile Modular APK v01.04.00
        shell: bash
        run: |
          set -e
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          ANDROID_JAR=$(ls -d "$SDK_DIR"/platforms/android-* | sort -V | tail -n 1)/android.jar
          BUILD_TOOLS=$(ls -d "$SDK_DIR"/build-tools/* | sort -V | tail -n 1)

          mkdir -p build/gen build/obj build/apk
          sed -i 's/^[[:space:]]*//' res/values/strings.xml AndroidManifest.xml

          # Автоматически исправляем this -> ctx в NotificationHelper.java на строке 54
          sed -i 's/Notification.Builder(this)/Notification.Builder(ctx)/g' src/ru/sut/bonch/NotificationHelper.java

          "$BUILD_TOOLS/aapt2" compile --dir res -o build/res.zip
          "$BUILD_TOOLS/aapt2" link -o build/unaligned.apk \
            -I "$ANDROID_JAR" \
            --manifest AndroidManifest.xml \
            -A assets \
            --java build/gen \
            build/res.zip

          javac -encoding UTF-8 -source 8 -target 8 \
            -bootclasspath "$ANDROID_JAR" \
            -cp "$ANDROID_JAR" \
            -d build/obj \
            build/gen/ru/sut/bonch/R.java \
            src/ru/sut/bonch/*.java

          "$BUILD_TOOLS/d8" --lib "$ANDROID_JAR" --output build/ build/obj/ru/sut/bonch/*.class
          zip -uj build/unaligned.apk build/classes.dex
          "$BUILD_TOOLS/zipalign" -f -p 4 build/unaligned.apk build/aligned.apk

          keytool -genkeypair -v \
            -keystore build/release.keystore \
            -storepass android -keypass android \
            -alias bonchkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=BonchAutoCheck,OU=IT,O=SUT,L=SPb,S=SPb,C=RU"

          "$BUILD_TOOLS/apksigner" sign \
            --ks build/release.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out build/apk/BonchAutoCheck-01.04.00.apk \
            build/aligned.apk

          ls -lh build/apk/BonchAutoCheck-01.04.00.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BonchAutoCheck-01.04.00-APK
          path: build/apk/BonchAutoCheck-01.04.00.apk

      - name: Publish Direct APK to GitHub Releases
        if: always()
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v01.04.00
          name: "Bonch AutoCheck v01.04.00 (Modular Architecture)"
          files: build/apk/BonchAutoCheck-01.04.00.apk
