name: Build Bonch APK 01.03.03

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Compile Native Android APK v01.03.03
        shell: bash
        run: |
          set -e
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          ANDROID_JAR=$(ls -d "$SDK_DIR"/platforms/android-* | sort -V | tail -n 1)/android.jar
          BUILD_TOOLS=$(ls -d "$SDK_DIR"/build-tools/* | sort -V | tail -n 1)

          mkdir -p src/ru/sut/bonch res/values build/gen build/obj build/apk

          cat <<-'EOF' > res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Bonch AutoCheck</string>
          </resources>
          EOF

          cat <<-'EOF' > AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="ru.sut.bonch"
              android:versionCode="112"
              android:versionName="01.03.03">

              <uses-sdk android:minSdkVersion="24" android:targetSdkVersion="33" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />

              <application
                  android:label="@string/app_name"
                  android:allowBackup="false"
                  android:usesCleartextTraffic="false"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <service
                      android:name=".BonchBackgroundDaemon"
                      android:process=":bg_daemon"
                      android:enabled="true"
                      android:exported="false"
                      android:stopWithTask="false"
                      android:foregroundServiceType="dataSync" />

                  <receiver
                      android:name=".BootReceiver"
                      android:process=":bg_daemon"
                      android:enabled="true"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                          <action android:name="ru.sut.bonch.WATCHDOG_PING" />
                      </intent-filter>
                  </receiver>

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:excludeFromRecents="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat <<-'EOF' > src/ru/sut/bonch/BootReceiver.java
          package ru.sut.bonch;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          import java.io.File;

          public class BootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  File enabledFlag = new File(context.getFilesDir(), "daemon_enabled.flag");
                  if (enabledFlag.exists()) {
                      Intent svc = new Intent(context, BonchBackgroundDaemon.class);
                      svc.putExtra("action", "start");
                      if (Build.VERSION.SDK_INT >= 26) {
                          context.startForegroundService(svc);
                      } else {
                          context.startService(svc);
                      }
                  }
              }
          }
          EOF

          cat <<-'EOF' > src/ru/sut/bonch/BonchBackgroundDaemon.java
          package ru.sut.bonch;

          import android.app.AlarmManager;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;
          import android.os.SystemClock;
          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.CookieHandler;
          import java.net.CookieManager;
          import java.net.CookiePolicy;
          import java.net.CookieStore;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;
          import java.nio.charset.Charset;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.Calendar;
          import java.util.Date;
          import java.util.HashMap;
          import java.util.HashSet;
          import java.util.Iterator;
          import java.util.LinkedHashMap;
          import java.util.LinkedHashSet;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;
          import java.util.Set;
          import java.util.TreeMap;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class BonchBackgroundDaemon extends Service {
              public static final String APP_VERSION = "01.03.03";
              private static final int TOTAL_SEMESTER_WEEKS = 18;

              private static final String BASE_URL = "https://lk.sut.ru/cabinet";
              private static final String LOGIN_PAGE_URL = BASE_URL + "/?login=yes";
              private static final String AUTH_URL = BASE_URL + "/lib/autentificationok.php";
              private static final String INI_URL = BASE_URL + "/ini.php";
              private static final String SCHEDULE_URL = BASE_URL + "/project/cabinet/forms/raspisanie.php";
              private static final String[] DIARY_URLS = {
                  BASE_URL + "/project/cabinet/forms/dnevnik.php",
                  BASE_URL + "/project/cabinet/forms/jurnal.php",
                  BASE_URL + "/project/cabinet/forms/usp.php"
              };

              private static final String CHANNEL_BG = "bonch_compact_service_010303";
              private static final String CHANNEL_ALERT = "bonch_alert_010303";
              private static final int FG_NOTIFICATION_ID = 2010;

              private static final String[] RU_DAYS_FULL = {
                  "Понедельник", "Вторник", "Среда", "Четверг", "Пятница", "Суббота"
              };
              private static final String[] RU_DAYS_SHORT = {
                  "Пн", "Вт", "Ср", "Чт", "Пт", "Сб"
              };

              private PowerManager.WakeLock wakeLock;
              private Thread workerThread;
              private CookieManager cookieManager;

              private volatile boolean active = false;
              private volatile boolean scanningSemester = false;
              private volatile String scanStatusText = "";
              private volatile String statusText = "Отключено";
              private volatile long serviceStartMillis = 0L;
              private volatile long lastDiaryPollMillis = 0L;
              private final List<String> logs = new ArrayList<>();

              private JSONArray semesterDaysArray = new JSONArray();
              private JSONArray smartCatalogArray = new JSONArray();
              private JSONArray diaryRecentArray = new JSONArray();
              private int todayDayIdx = 0;

              private final Set<String> completedWindowsToday = new HashSet<>();
              private final Set<String> markedRaspIdsToday = new HashSet<>();
              private final Set<String> notifiedSkippedToday = new HashSet<>();
              private final Map<String, String> checkInTimeByStart = new HashMap<>();
              private final Set<String> todayRealStartTimes = new HashSet<>();
              private String currentDayStamp = "";

              private volatile boolean isAuthenticated = false;
              private String lastUsedLogin = "";
              private String lastUsedPass = "";

              @Override
              public void onCreate() {
                  super.onCreate();
                  resetCookies();
                  PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                  if (pm != null) {
                      wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "BonchDaemon::SmartServiceLock");
                  }
                  createNotificationChannels();
                  loadPersistedState();
                  loadSemesterCacheFiles();
              }

              private synchronized void resetCookies() {
                  try {
                      if (cookieManager != null) {
                          CookieStore store = cookieManager.getCookieStore();
                          if (store != null) {
                              store.removeAll();
                          }
                      }
                      cookieManager = new CookieManager(null, CookiePolicy.ACCEPT_ALL);
                      CookieHandler.setDefault(cookieManager);
                  } catch (Exception ignored) {}
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  JSONObject cfg = readConfigFile();
                  String action = intent != null ? intent.getStringExtra("action") : null;
                  File enabledFlag = new File(getFilesDir(), "daemon_enabled.flag");

                  if (action == null) {
                      action = enabledFlag.exists() ? "start" : "stop";
                  }

                  if ("stop".equals(action)) {
                      if (enabledFlag.exists()) enabledFlag.delete();
                      stopDaemon();
                      return START_NOT_STICKY;
                  }

                  if ("refresh_rules".equals(action)) {
                      syncTodayRealStartTimes();
                      saveStateFile();
                      return active ? START_STICKY : START_NOT_STICKY;
                  }

                  if ("test_notif".equals(action)) {
                      sendCheckInAlertNotification(
                          "🔔 Тест уведомлений Bonch AutoCheck",
                          "Уведомления об оценках из Дневника и парах работают корректно!"
                      );
                      addLog("Отправлено тестовое уведомление.");
                      saveStateFile();
                      return active ? START_STICKY : START_NOT_STICKY;
                  }

                  final String login = cfg.optString("login", "").trim();
                  final String pass = cfg.optString("password", "").trim();
                  final String mode = cfg.optString("mode", "full_lesson");

                  if ("check_diary_now".equals(action)) {
                      new Thread(new Runnable() {
                          @Override
                          public void run() {
                              if (login.isEmpty() || pass.isEmpty()) {
                                  addLog("Введите логин и пароль для проверки Дневника!");
                                  saveStateFile();
                                  return;
                              }
                              addLog("📚 Проверка раздела «Учеба -> Дневник»...");
                              saveStateFile();
                              pollDiaryGradesAndAttendance(login, pass, true);
                          }
                      }).start();
                      return active ? START_STICKY : START_NOT_STICKY;
                  }

                  if ("scan_semester".equals(action)) {
                      new Thread(new Runnable() {
                          @Override
                          public void run() {
                              if (login.isEmpty() || pass.isEmpty()) {
                                  addLog("Введите логин и пароль для анализа семестра!");
                                  saveStateFile();
                                  return;
                              }
                              scanFullSemesterSchedule(login, pass);
                          }
                      }).start();
                      return active ? START_STICKY : START_NOT_STICKY;
                  }

                  if ("check_once".equals(action)) {
                      new Thread(new Runnable() {
                          @Override
                          public void run() {
                              if (login.isEmpty() || pass.isEmpty()) {
                                  addLog("Сначала введите логин и пароль!");
                                  saveStateFile();
                                  return;
                              }
                              addLog("Проверка текущей недели...");
                              saveStateFile();
                              WindowState win = getCurrentWindowState(mode);
                              pollScheduleAndCheckIn(login, pass, win != null ? win.startTime : null);
                              if (isNotifyDiaryEnabled()) {
                                  pollDiaryGradesAndAttendance(login, pass, false);
                              }
                              if ((smartCatalogArray.length() == 0 || semesterDaysArray.length() < 12) && !scanningSemester) {
                                  scanFullSemesterSchedule(login, pass);
                              }
                          }
                      }).start();
                      return active ? START_STICKY : START_NOT_STICKY;
                  }

                  if (login.isEmpty() || pass.isEmpty()) {
                      statusText = "Введите логин и пароль от lk.sut.ru!";
                      addLog(statusText);
                      if (enabledFlag.exists()) enabledFlag.delete();
                      saveStateFile();
                      stopSelf();
                      return START_NOT_STICKY;
                  }

                  try {
                      if (!enabledFlag.exists()) enabledFlag.createNewFile();
                  } catch (Exception ignored) {}

                  if (serviceStartMillis == 0L) {
                      serviceStartMillis = System.currentTimeMillis();
                  }

                  startForeground(FG_NOTIFICATION_ID, buildCompactServiceNotification("Подключено • Умный режим"));
                  scheduleWatchdogAlarm();

                  if (!login.equals(lastUsedLogin) || !pass.equals(lastUsedPass)) {
                      isAuthenticated = false;
                      lastUsedLogin = login;
                      lastUsedPass = pass;
                  }

                  if (!active || workerThread == null || !workerThread.isAlive()) {
                      startWorkerLoop();
                  }
                  saveStateFile();
                  return START_STICKY;
              }

              private void scheduleWatchdogAlarm() {
                  try {
                      Intent restartIntent = new Intent(getApplicationContext(), BootReceiver.class);
                      restartIntent.setAction("ru.sut.bonch.WATCHDOG_PING");
                      int pFlags = Build.VERSION.SDK_INT >= 23
                          ? (PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE)
                          : PendingIntent.FLAG_UPDATE_CURRENT;
                      PendingIntent pi = PendingIntent.getBroadcast(getApplicationContext(), 99, restartIntent, pFlags);
                      AlarmManager am = (AlarmManager) getSystemService(Context.ALARM_SERVICE);
                      if (am != null) {
                          long triggerAt = SystemClock.elapsedRealtime() + 25000L;
                          if (Build.VERSION.SDK_INT >= 23) {
                              am.setExactAndAllowWhileIdle(AlarmManager.ELAPSED_REALTIME_WAKEUP, triggerAt, pi);
                          } else {
                              am.setExact(AlarmManager.ELAPSED_REALTIME_WAKEUP, triggerAt, pi);
                          }
                      }
                  } catch (Exception ignored) {}
              }

              @Override
              public void onTaskRemoved(Intent rootIntent) {
                  File enabledFlag = new File(getFilesDir(), "daemon_enabled.flag");
                  if (enabledFlag.exists()) {
                      addLog("Окно закрыто — служба продолжает работу.");
                      saveStateFile();
                      scheduleWatchdogAlarm();
                  }
                  super.onTaskRemoved(rootIntent);
              }

              @Override
              public void onDestroy() {
                  File enabledFlag = new File(getFilesDir(), "daemon_enabled.flag");
                  if (enabledFlag.exists()) {
                      scheduleWatchdogAlarm();
                  }
                  super.onDestroy();
              }

              private void startWorkerLoop() {
                  active = true;
                  if (wakeLock != null && !wakeLock.isHeld()) {
                      wakeLock.acquire();
                  }

                  workerThread = new Thread(new Runnable() {
                      @Override
                      public void run() {
                          addLog("Служба v" + APP_VERSION + " запущена.");
                          saveStateFile();

                          while (active) {
                              File enabledFlag = new File(getFilesDir(), "daemon_enabled.flag");
                              if (!enabledFlag.exists()) {
                                  break;
                              }

                              scheduleWatchdogAlarm();

                              JSONObject cfg = readConfigFile();
                              String login = cfg.optString("login", "").trim();
                              String password = cfg.optString("password", "").trim();
                              String intervalStr = cfg.optString("interval", "1");
                              String mode = cfg.optString("mode", "full_lesson");

                              double intervalMin = 1.0;
                              try {
                                  intervalMin = Double.parseDouble(intervalStr);
                              } catch (Exception ignored) {}

                              String today = new SimpleDateFormat("dd.MM.yyyy", Locale.US).format(new Date());
                              if (!today.equals(currentDayStamp)) {
                                  currentDayStamp = today;
                                  completedWindowsToday.clear();
                                  markedRaspIdsToday.clear();
                                  notifiedSkippedToday.clear();
                                  checkInTimeByStart.clear();
                                  recalculateTodayIndex();
                              }

                              if (!isAuthenticated) {
                                  updateStatus("Подключение к lk.sut.ru...");
                                  if (!authenticate(login, password)) {
                                      updateStatus("Ошибка входа (проверьте логин/пароль)");
                                      sleepQuietly(20000L);
                                      continue;
                                  }
                                  WindowState initWin = getCurrentWindowState(mode);
                                  pollScheduleAndCheckIn(login, password, initWin != null ? initWin.startTime : null);
                                  if (isNotifyDiaryEnabled()) {
                                      pollDiaryGradesAndAttendance(login, password, false);
                                  }
                                  if ((smartCatalogArray.length() == 0 || semesterDaysArray.length() < 12) && !scanningSemester) {
                                      new Thread(new Runnable() {
                                          @Override
                                          public void run() {
                                              scanFullSemesterSchedule(login, password);
                                          }
                                      }).start();
                                  }
                              }

                              // Проверяем уведомления о парах, на которые ВЫКЛЮЧЕНА автоотметка
                              checkAndNotifySkippedLessonsToday();

                              // Периодическая проверка раздела «Учеба -> Дневник» (каждые 10 минут), если включен тумблер
                              if (isNotifyDiaryEnabled() && (System.currentTimeMillis() - lastDiaryPollMillis > 600000L)) {
                                  pollDiaryGradesAndAttendance(login, password, false);
                              }

                              syncTodayRealStartTimes();
                              WindowState win = getCurrentWindowState(mode);

                              if (win == null) {
                                  String nextLesson = findNextUnmarkedLessonTime();
                                  if (nextLesson != null) {
                                      updateStatus("Подключено • Ждем пару в " + nextLesson);
                                  } else {
                                      updateStatus("Подключено • На сегодня активных пар больше нет");
                                  }
                                  sleepQuietly(25000L);
                                  continue;
                              }

                              if (completedWindowsToday.contains(win.startTime)) {
                                  String tMarked = checkInTimeByStart.get(win.startTime);
                                  String nextLesson = findNextLessonAfter(win.startTime);
                                  String waitText = nextLesson != null ? ("Спим до пары в " + nextLesson) : "Пары на сегодня завершены";
                                  updateStatus("✅ Отмечен (" + (tMarked != null ? tMarked : "ОК") + ") • " + waitText);
                                  sleepQuietly(25000L);
                                  continue;
                              }

                              updateStatus("Ловим кнопку • " + win.label);
                              pollScheduleAndCheckIn(login, password, win.startTime);

                              if (completedWindowsToday.contains(win.startTime)) {
                                  String tMarked = checkInTimeByStart.get(win.startTime);
                                  String nextLesson = findNextLessonAfter(win.startTime);
                                  String waitText = nextLesson != null ? ("Спим до пары в " + nextLesson) : "Пары на сегодня завершены";
                                  updateStatus("✅ Отмечен (" + (tMarked != null ? tMarked : "ОК") + ") • " + waitText);
                                  sleepQuietly(25000L);
                              } else {
                                  sleepQuietly(Math.max(15000L, (long) (intervalMin * 60000L)));
                              }
                          }
                      }
                  });
                  workerThread.start();
              }

              private void stopDaemon() {
                  active = false;
                  serviceStartMillis = 0L;
                  statusText = "Отключено";
                  if (wakeLock != null && wakeLock.isHeld()) {
                      wakeLock.release();
                  }
                  if (workerThread != null) {
                      workerThread.interrupt();
                  }
                  addLog("Автоотметка отключена.");
                  saveStateFile();
                  stopForeground(true);
                  stopSelf();
              }

              private JSONObject readConfigFile() {
                  try {
                      File f = new File(getFilesDir(), "user_config_010303.json");
                      if (!f.exists()) return new JSONObject();
                      ByteArrayOutputStream baos = new ByteArrayOutputStream();
                      try (FileInputStream fis = new FileInputStream(f)) {
                          byte[] buf = new byte[2048];
                          int n;
                          while ((n = fis.read(buf)) != -1) baos.write(buf, 0, n);
                      }
                      return new JSONObject(new String(baos.toByteArray(), "UTF-8"));
                  } catch (Exception e) {
                      return new JSONObject();
                  }
              }

              private JSONObject readNotifPrefsFile() {
                  try {
                      File f = new File(getFilesDir(), "notif_prefs_010303.json");
                      if (!f.exists()) {
                          JSONObject def = new JSONObject();
                          def.put("notifyDiary", true);
                          def.put("notifySkippedLessons", true);
                          return def;
                      }
                      ByteArrayOutputStream baos = new ByteArrayOutputStream();
                      try (FileInputStream fis = new FileInputStream(f)) {
                          byte[] buf = new byte[2048];
                          int n;
                          while ((n = fis.read(buf)) != -1) baos.write(buf, 0, n);
                      }
                      return new JSONObject(new String(baos.toByteArray(), "UTF-8"));
                  } catch (Exception e) {
                      return new JSONObject();
                  }
              }

              private boolean isNotifyDiaryEnabled() {
                  return readNotifPrefsFile().optBoolean("notifyDiary", true);
              }

              private boolean isNotifySkippedLessonsEnabled() {
                  return readNotifPrefsFile().optBoolean("notifySkippedLessons", true);
              }

              private JSONObject readSmartRulesMap() {
                  try {
                      File f = new File(getFilesDir(), "smart_rules_010303.json");
                      if (!f.exists()) return new JSONObject();
                      ByteArrayOutputStream baos = new ByteArrayOutputStream();
                      try (FileInputStream fis = new FileInputStream(f)) {
                          byte[] buf = new byte[4096];
                          int n;
                          while ((n = fis.read(buf)) != -1) baos.write(buf, 0, n);
                      }
                      return new JSONObject(new String(baos.toByteArray(), "UTF-8"));
                  } catch (Exception e) {
                      return new JSONObject();
                  }
              }

              private boolean isLessonAllowedBySmartFilter(String ruleKey) {
                  if (ruleKey == null || ruleKey.isEmpty()) return true;
                  JSONObject rules = readSmartRulesMap();
                  if (!rules.has(ruleKey)) {
                      return true;
                  }
                  return rules.optBoolean(ruleKey, true);
              }

              // Уведомление о парах, на которые ВЫКЛЮЧЕНА автоотметка во вкладке 🤖 (за 10 минут до начала и во время пары)
              private void checkAndNotifySkippedLessonsToday() {
                  if (!isNotifySkippedLessonsEnabled()) return;
                  if (semesterDaysArray == null || semesterDaysArray.length() == 0) return;

                  String todayStr = new SimpleDateFormat("dd.MM.yyyy", Locale.US).format(new Date());
                  Calendar now = Calendar.getInstance();
                  long nowMillis = now.getTimeInMillis();

                  for (int i = 0; i < semesterDaysArray.length(); i++) {
                      JSONObject d = semesterDaysArray.optJSONObject(i);
                      if (d == null || !todayStr.equals(d.optString("dateStr", ""))) continue;

                      JSONArray lessons = d.optJSONArray("lessons");
                      if (lessons == null) break;

                      for (int k = 0; k < lessons.length(); k++) {
                          JSONObject les = lessons.optJSONObject(k);
                          if (les == null) continue;
                          String st = les.optString("startTime", "");
                          String rk = les.optString("ruleKey", "");
                          String subj = les.optString("subjectTitle", "Пара");
                          String lType = les.optString("lessonType", "Занятие");
                          String teacher = les.optString("teacher", "");

                          // Только если автоотметка на эту пару ВЫКЛЮЧЕНА!
                          if (!st.isEmpty() && !isLessonAllowedBySmartFilter(rk)) {
                              String uniqueKey = todayStr + "_" + st + "_" + rk;
                              if (notifiedSkippedToday.contains(uniqueKey)) continue;

                              try {
                                  String[] parts = st.replace(".", ":").split(":");
                                  Calendar start = (Calendar) now.clone();
                                  start.set(Calendar.HOUR_OF_DAY, Integer.parseInt(parts[0]));
                                  start.set(Calendar.MINUTE, Integer.parseInt(parts[1]));
                                  start.set(Calendar.SECOND, 0);
                                  double diffMin = (nowMillis - start.getTimeInMillis()) / 60000.0;

                                  if (diffMin >= -10.0 && diffMin <= 45.0) {
                                      notifiedSkippedToday.add(uniqueKey);
                                      String title = "🔔 Пара без автоотметки (" + st + ")";
                                      String msg = subj + " • " + lType + (teacher.isEmpty() ? "" : " (" + teacher + ")")
                                          + " — автоотметка выключена в 🤖.";
                                      addLog(title + ": " + msg);
                                      sendCheckInAlertNotification(title, msg);
                                      saveStateFile();
                                  }
                              } catch (Exception ignored) {}
                          }
                      }
                      break;
                  }
              }

              // Парсинг раздела «Учеба -> Дневник» (таблицы с ячейками оценок и посещений)
              private synchronized void pollDiaryGradesAndAttendance(String login, String password, boolean manualTrigger) {
                  lastDiaryPollMillis = System.currentTimeMillis();
                  if (!isAuthenticated && !authenticate(login, password)) {
                      return;
                  }

                  try {
                      File snapFile = new File(getFilesDir(), "diary_snapshot_010303.json");
                      boolean hadBaseline = snapFile.exists();
                      JSONObject oldSnap = new JSONObject();
                      if (hadBaseline) {
                          ByteArrayOutputStream baos = new ByteArrayOutputStream();
                          try (FileInputStream fis = new FileInputStream(snapFile)) {
                              byte[] buf = new byte[4096];
                              int n;
                              while ((n = fis.read(buf)) != -1) baos.write(buf, 0, n);
                          }
                          oldSnap = new JSONObject(new String(baos.toByteArray(), "UTF-8"));
                      }

                      JSONObject newSnap = new JSONObject();
                      Iterator<String> oldKeys = oldSnap.keys();
                      while (oldKeys.hasNext()) {
                          String k = oldKeys.next();
                          newSnap.put(k, oldSnap.optString(k, ""));
                      }

                      List<JSONObject> recentEntries = new ArrayList<>();
                      List<String> newAlerts = new ArrayList<>();

                      Pattern trPattern = Pattern.compile("<tr[^>]*>(.*?)</tr>", Pattern.DOTALL | Pattern.CASE_INSENSITIVE);
                      Pattern cellPattern = Pattern.compile("<t[dh][^>]*>(.*?)</t[dh]>", Pattern.DOTALL | Pattern.CASE_INSENSITIVE);
                      Pattern dateRegex = Pattern.compile("(\\d{2}\\.\\d{2}(?:\\.\\d{2,4})?)");
                      Pattern cyrillicSubjectRegex = Pattern.compile("[А-Яа-яЁё]{4,}");

                      String todayDateShort = new SimpleDateFormat("dd.MM.yyyy", Locale.US).format(new Date());

                      for (String url : DIARY_URLS) {
                          String html = httpRequest("POST", url, "");
                          if (html.length() < 40 || !html.toLowerCase(Locale.ROOT).contains("<table")) {
                              continue;
                          }

                          Matcher trMat = trPattern.matcher(html);
                          List<String> currentHeaderDates = new ArrayList<>();
                          String currentSectionSubject = "";

                          while (trMat.find()) {
                              String trInner = trMat.group(1);
                              Matcher tdMat = cellPattern.matcher(trInner);
                              List<String> cells = new ArrayList<>();
                              while (tdMat.find()) {
                                  String cText = tdMat.group(1)
                                      .replaceAll("<[^>]+>", " ")
                                      .replaceAll("&nbsp;", " ")
                                      .replaceAll("\\s+", " ")
                                      .trim();
                                  cells.add(cText);
                              }
                              if (cells.isEmpty()) continue;

                              // 1. Проверяем, является ли строка шапкой с датами колонок (матричная таблица Дневника)
                              int dateCountInRow = 0;
                              for (String c : cells) {
                                  if (dateRegex.matcher(c).find()) dateCountInRow++;
                              }
                              if (dateCountInRow >= 2 && cells.size() >= 3) {
                                  currentHeaderDates.clear();
                                  for (String c : cells) {
                                      Matcher dm = dateRegex.matcher(c);
                                      currentHeaderDates.add(dm.find() ? dm.group(1) : c);
                                  }
                                  continue;
                              }

                              // 2. Если строка состоит из 1 ячейки с названием предмета
                              if (cells.size() == 1 && cyrillicSubjectRegex.matcher(cells.get(0)).find() && cells.get(0).length() > 5 && cells.get(0).length() < 90) {
                                  currentSectionSubject = cells.get(0);
                                  continue;
                              }

                              // 3. Разбор строки матричной таблицы (Колонка 0/1 = Предмет, остальные колонки = клетки за конкретные числа)
                              String rowSubj = "";
                              int firstDataCol = 1;
                              if (cyrillicSubjectRegex.matcher(cells.get(0)).find() && ! cells.get(0).matches("^\\d+$")) {
                                  rowSubj = cells.get(0);
                                  firstDataCol = 1;
                              } else if (cells.size() >= 2 && cyrillicSubjectRegex.matcher(cells.get(1)).find()) {
                                  rowSubj = cells.get(1);
                                  firstDataCol = 2;
                              }

                              if (!rowSubj.isEmpty() && !currentHeaderDates.isEmpty() && cells.size() == currentHeaderDates.size()) {
                                  for (int col = firstDataCol; col < cells.size(); col++) {
                                      String cellVal = cells.get(col).trim();
                                      if (cellVal.isEmpty() || "-".equals(cellVal) || "—".equals(cellVal)) continue;
                                      String dateLabel = currentHeaderDates.get(col);
                                      if (dateLabel == null || dateLabel.isEmpty()) dateLabel = todayDateShort;

                                      String cellKey = rowSubj + "||" + dateLabel + "||col" + col;
                                      String prevVal = oldSnap.optString(cellKey, "");
                                      newSnap.put(cellKey, cellVal);

                                      JSONObject entry = new JSONObject();
                                      entry.put("subject", rowSubj);
                                      entry.put("date", dateLabel);
                                      entry.put("value", cellVal);
                                      recentEntries.add(entry);

                                      if (hadBaseline && !cellVal.equals(prevVal)) {
                                          newAlerts.add("Предмет: " + rowSubj + " • Число: " + dateLabel + " • В клетке: «" + cellVal + "»");
                                      }
                                  }
                                  continue;
                              }

                              // 4. Разбор построчной таблицы Дневника (где в строке есть дата, предмет/тема и клетка оценки/посещения)
                              String foundDate = "";
                              for (String c : cells) {
                                  Matcher dm = dateRegex.matcher(c);
                                  if (dm.find()) {
                                      foundDate = dm.group(1);
                                      break;
                                  }
                              }

                              if (!foundDate.isEmpty() && cells.size() >= 3) {
                                  String subjName = !rowSubj.isEmpty() ? rowSubj : (!currentSectionSubject.isEmpty() ? currentSectionSubject : "Дисциплина");
                                  String lastCell = cells.get(cells.size() - 1).trim();
                                  String prevCell = cells.size() >= 4 ? cells.get(cells.size() - 2).trim() : "";
                                  String combinedVal = (!lastCell.isEmpty() && !lastCell.equals(foundDate)) ? lastCell : prevCell;

                                  if (!combinedVal.isEmpty() && !"-".equals(combinedVal) && !combinedVal.equals(subjName)) {
                                      String cellKey = subjName + "||" + foundDate + "||" + cells.get(0);
                                      String oldVal = oldSnap.optString(cellKey, "");
                                      newSnap.put(cellKey, combinedVal);

                                      JSONObject entry = new JSONObject();
                                      entry.put("subject", subjName);
                                      entry.put("date", foundDate);
                                      entry.put("value", combinedVal);
                                      recentEntries.add(entry);

                                      if (hadBaseline && !combinedVal.equals(oldVal)) {
                                          newAlerts.add("Предмет: " + subjName + " • Число: " + foundDate + " • В клетке: «" + combinedVal + "»");
                                      }
                                  }
                              }
                          }
                      }

                      try (FileOutputStream fos = new FileOutputStream(snapFile)) {
                          fos.write(newSnap.toString().getBytes("UTF-8"));
                      }

                      JSONArray recentJson = new JSONArray();
                      int startIdx = Math.max(0, recentEntries.size() - 25);
                      for (int i = recentEntries.size() - 1; i >= startIdx; i--) {
                          recentJson.put(recentEntries.get(i));
                      }
                      diaryRecentArray = recentJson;
                      saveSemesterCacheFiles();

                      if (!newAlerts.isEmpty() && isNotifyDiaryEnabled()) {
                          for (String alertText : newAlerts) {
                              String title = "📊 Новая запись в Дневнике!";
                              addLog(title + " " + alertText);
                              sendCheckInAlertNotification(title, alertText);
                          }
                      } else if (manualTrigger) {
                          addLog("📚 Дневник проверен (отслеживается ячеек: " + newSnap.length() + ", новых изменений: " + newAlerts.size() + ").");
                      }
                      saveStateFile();
                  } catch (Exception e) {
                      if (manualTrigger) {
                          addLog("Ошибка проверки Дневника: " + e.getMessage());
                          saveStateFile();
                      }
                  }
              }

