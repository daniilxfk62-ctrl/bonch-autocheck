name: Build Bonch APK 01.02.03

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Compile Native Android VPN-Engine APK v01.02.03
        shell: bash
        run: |
          set -e
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          ANDROID_JAR=$(ls -d "$SDK_DIR"/platforms/android-* | sort -V | tail -n 1)/android.jar
          BUILD_TOOLS=$(ls -d "$SDK_DIR"/build-tools/* | sort -V | tail -n 1)

          mkdir -p src/ru/sut/bonch res/values build/gen build/obj build/apk

          cat <<-'EOF' > res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Bonch AutoCheck</string>
          </resources>
          EOF

          cat <<-'EOF' > AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="ru.sut.bonch"
              android:versionCode="105"
              android:versionName="01.02.03">

              <uses-sdk android:minSdkVersion="24" android:targetSdkVersion="33" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />

              <application
                  android:label="@string/app_name"
                  android:allowBackup="false"
                  android:usesCleartextTraffic="false"
                  android:persistent="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <service
                      android:name=".BonchVpnEngineService"
                      android:process=":vpn_engine"
                      android:enabled="true"
                      android:exported="true"
                      android:stopWithTask="false"
                      android:permission="android.permission.BIND_VPN_SERVICE">
                      <intent-filter>
                          <action android:name="android.net.VpnService" />
                      </intent-filter>
                  </service>

                  <receiver
                      android:name=".BootReceiver"
                      android:process=":vpn_engine"
                      android:enabled="true"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                          <action android:name="ru.sut.bonch.WATCHDOG_PING" />
                      </intent-filter>
                  </receiver>

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat <<-'EOF' > src/ru/sut/bonch/BootReceiver.java
          package ru.sut.bonch;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Build;
          import java.io.File;

          public class BootReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context context, Intent intent) {
                  File enabledFlag = new File(context.getFilesDir(), "engine_enabled.flag");
                  if (enabledFlag.exists()) {
                      Intent svc = new Intent(context, BonchVpnEngineService.class);
                      svc.putExtra("action", "start");
                      if (Build.VERSION.SDK_INT >= 26) {
                          context.startForegroundService(svc);
                      } else {
                          context.startService(svc);
                      }
                  }
              }
          }
          EOF

          cat <<-'EOF' > src/ru/sut/bonch/BonchVpnEngineService.java
          package ru.sut.bonch;

          import android.app.AlarmManager;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.media.AudioFormat;
          import android.media.AudioManager;
          import android.media.AudioTrack;
          import android.net.VpnService;
          import android.os.Build;
          import android.os.ParcelFileDescriptor;
          import android.os.PowerManager;
          import android.os.SystemClock;
          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.CookieHandler;
          import java.net.CookieManager;
          import java.net.CookiePolicy;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;
          import java.nio.charset.Charset;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.Calendar;
          import java.util.Date;
          import java.util.HashMap;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;
          import java.util.Set;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;
          import org.json.JSONArray;
          import org.json.JSONObject;

          public class BonchVpnEngineService extends VpnService {
              public static final String APP_VERSION = "01.02.03";

              private static final String BASE_URL = "https://lk.sut.ru/cabinet";
              private static final String LOGIN_PAGE_URL = BASE_URL + "/?login=yes";
              private static final String AUTH_URL = BASE_URL + "/lib/autentificationok.php";
              private static final String INI_URL = BASE_URL + "/ini.php";
              private static final String SCHEDULE_URL = BASE_URL + "/project/cabinet/forms/raspisanie.php";

              private static final String CHANNEL_BG = "bonch_vpn_engine_010203";
              private static final String CHANNEL_ALERT = "bonch_alert_010203";
              private static final int FG_NOTIFICATION_ID = 2001;

              private static final String[] BELL_SCHEDULE = {
                  "09:00", "10:30", "10:45", "13:00", "14:45", "16:30", "18:15", "20:00"
              };

              private ParcelFileDescriptor vpnTunnel = null;
              private PowerManager.WakeLock wakeLock;
              private AudioTrack silentAudioTrack;
              private Thread workerThread;
              private Thread tunnelKeepAliveThread;

              private volatile boolean active = false;
              private volatile String statusText = "Отключено";
              private volatile long serviceStartMillis = 0L;
              private final List<String> logs = new ArrayList<>();
              private JSONArray daysWeekArray = new JSONArray();
              private int defaultNearestDayIdx = 0;

              private final Set<String> completedWindowsToday = new HashSet<>();
              private final Set<String> markedRaspIdsToday = new HashSet<>();
              private final Map<String, String> checkInTimeByStart = new HashMap<>();
              private final Set<String> parsedTimes = new HashSet<>();
              private String currentDayStamp = "";

              private volatile boolean isAuthenticated = false;
              private String lastUsedLogin = "";
              private String lastUsedPass = "";

              @Override
              public void onCreate() {
                  super.onCreate();
                  if (CookieHandler.getDefault() == null) {
                      CookieHandler.setDefault(new CookieManager(null, CookiePolicy.ACCEPT_ALL));
                  }
                  PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                  if (pm != null) {
                      wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "BonchVpnEngine::CoreWakeLock");
                  }
                  createNotificationChannels();
                  loadPersistedState();
              }

              private void establishVpnTunnel() {
                  if (vpnTunnel != null) return;
                  try {
                      Builder builder = new Builder();
                      builder.setSession("Bonch AutoCheck VPN")
                             .addAddress("10.254.254.1", 30)
                             .addRoute("10.254.254.0", 30)
                             .setMtu(1400)
                             .setBlocking(true);
                      if (Build.VERSION.SDK_INT >= 29) {
                          builder.setMetered(false);
                      }
                      try {
                          builder.addDisallowedApplication(getPackageName());
                      } catch (Exception ignored) {}

                      vpnTunnel = builder.establish();

                      if (vpnTunnel != null && (tunnelKeepAliveThread == null || !tunnelKeepAliveThread.isAlive())) {
                          tunnelKeepAliveThread = new Thread(new Runnable() {
                              @Override
                              public void run() {
                                  byte[] packet = new byte[1024];
                                  while (active && vpnTunnel != null) {
                                      try {
                                          FileInputStream in = new FileInputStream(vpnTunnel.getFileDescriptor());
                                          int read = in.read(packet);
                                          if (read <= 0) {
                                              Thread.sleep(2000L);
                                          }
                                      } catch (Exception e) {
                                          try { Thread.sleep(2000L); } catch (Exception ignored) {}
                                      }
                                  }
                              }
                          });
                          tunnelKeepAliveThread.start();
                      }
                  } catch (Exception e) {
                      addLog("Работаем в фоновом режиме Foreground.");
                  }
              }

              private void closeVpnTunnel() {
                  if (vpnTunnel != null) {
                      try {
                          vpnTunnel.close();
                      } catch (Exception ignored) {}
                      vpnTunnel = null;
                  }
              }

              private void startSilentAudioKeepAlive() {
                  try {
                      if (silentAudioTrack != null) return;
                      int sampleRate = 8000;
                      int minBuf = AudioTrack.getMinBufferSize(sampleRate, AudioFormat.CHANNEL_OUT_MONO, AudioFormat.ENCODING_PCM_16BIT);
                      if (minBuf <= 0) minBuf = 1600;
                      silentAudioTrack = new AudioTrack(
                          AudioManager.STREAM_MUSIC,
                          sampleRate,
                          AudioFormat.CHANNEL_OUT_MONO,
                          AudioFormat.ENCODING_PCM_16BIT,
                          minBuf,
                          AudioTrack.MODE_STATIC
                      );
                      byte[] silence = new byte[minBuf];
                      silentAudioTrack.write(silence, 0, silence.length);
                      silentAudioTrack.setLoopPoints(0, silence.length / 2, -1);
                      silentAudioTrack.setStereoVolume(0f, 0f);
                      silentAudioTrack.play();
                  } catch (Exception ignored) {}
              }

              private void stopSilentAudioKeepAlive() {
                  try {
                      if (silentAudioTrack != null) {
                          silentAudioTrack.stop();
                          silentAudioTrack.release();
                          silentAudioTrack = null;
                      }
                  } catch (Exception ignored) {}
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  JSONObject cfg = readConfigFile();
                  String action = intent != null ? intent.getStringExtra("action") : null;
                  File enabledFlag = new File(getFilesDir(), "engine_enabled.flag");

                  if (action == null) {
                      action = enabledFlag.exists() ? "start" : "stop";
                  }

                  if ("stop".equals(action)) {
                      if (enabledFlag.exists()) enabledFlag.delete();
                      stopEngine();
                      return START_NOT_STICKY;
                  }

                  final String login = cfg.optString("login", "").trim();
                  final String pass = cfg.optString("password", "").trim();
                  final String mode = cfg.optString("mode", "full_lesson");

                  if ("check_once".equals(action)) {
                      new Thread(new Runnable() {
                          @Override
                          public void run() {
                              if (login.isEmpty() || pass.isEmpty()) {
                                  addLog("Сначала введите логин и пароль!");
                                  saveStateFile();
                                  return;
                              }
                              addLog("Обновление расписания на неделю...");
                              saveStateFile();
                              WindowState win = getCurrentWindowState(mode);
                              pollScheduleAndCheckIn(login, pass, win != null ? win.startTime : null);
                          }
                      }).start();
                      return active ? START_STICKY : START_NOT_STICKY;
                  }

                  if (login.isEmpty() || pass.isEmpty()) {
                      statusText = "Введите логин и пароль от lk.sut.ru!";
                      addLog(statusText);
                      if (enabledFlag.exists()) enabledFlag.delete();
                      saveStateFile();
                      stopSelf();
                      return START_NOT_STICKY;
                  }

                  try {
                      if (!enabledFlag.exists()) enabledFlag.createNewFile();
                  } catch (Exception ignored) {}

                  if (serviceStartMillis == 0L) {
                      serviceStartMillis = System.currentTimeMillis();
                  }

                  startForeground(FG_NOTIFICATION_ID, buildForegroundNotification("VPN-движок активен в фоне"));
                  establishVpnTunnel();
                  startSilentAudioKeepAlive();
                  scheduleWatchdogAlarm();

                  if (!login.equals(lastUsedLogin) || !pass.equals(lastUsedPass)) {
                      isAuthenticated = false;
                      lastUsedLogin = login;
                      lastUsedPass = pass;
                  }

                  if (!active || workerThread == null || !workerThread.isAlive()) {
                      startWorkerLoop();
                  }
                  saveStateFile();
                  return START_STICKY;
              }

              private void scheduleWatchdogAlarm() {
                  try {
                      Intent restartIntent = new Intent(getApplicationContext(), BootReceiver.class);
                      restartIntent.setAction("ru.sut.bonch.WATCHDOG_PING");
                      int pFlags = Build.VERSION.SDK_INT >= 23
                          ? (PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE)
                          : PendingIntent.FLAG_UPDATE_CURRENT;
                      PendingIntent pi = PendingIntent.getBroadcast(getApplicationContext(), 99, restartIntent, pFlags);
                      AlarmManager am = (AlarmManager) getSystemService(Context.ALARM_SERVICE);
                      if (am != null) {
                          long triggerAt = SystemClock.elapsedRealtime() + 30000L;
                          if (Build.VERSION.SDK_INT >= 23) {
                              am.setExactAndAllowWhileIdle(AlarmManager.ELAPSED_REALTIME_WAKEUP, triggerAt, pi);
                          } else {
                              am.setExact(AlarmManager.ELAPSED_REALTIME_WAKEUP, triggerAt, pi);
                          }
                      }
                  } catch (Exception ignored) {}
              }

              @Override
              public void onTaskRemoved(Intent rootIntent) {
                  File enabledFlag = new File(getFilesDir(), "engine_enabled.flag");
                  if (enabledFlag.exists()) {
                      addLog("Вкладка закрыта — VPN-движок продолжает работу.");
                      saveStateFile();
                      scheduleWatchdogAlarm();
                  }
                  super.onTaskRemoved(rootIntent);
              }

              @Override
              public void onRevoke() {
                  File enabledFlag = new File(getFilesDir(), "engine_enabled.flag");
                  if (enabledFlag.exists()) enabledFlag.delete();
                  stopEngine();
                  super.onRevoke();
              }

              private void startWorkerLoop() {
                  active = true;
                  if (wakeLock != null && !wakeLock.isHeld()) {
                      wakeLock.acquire();
                  }

                  workerThread = new Thread(new Runnable() {
                      @Override
                      public void run() {
                          addLog("VPN-движок v" + APP_VERSION + " запущен (:vpn_engine).");
                          saveStateFile();

                          while (active) {
                              File enabledFlag = new File(getFilesDir(), "engine_enabled.flag");
                              if (!enabledFlag.exists()) {
                                  break;
                              }

                              scheduleWatchdogAlarm();
                              establishVpnTunnel();

                              JSONObject cfg = readConfigFile();
                              String login = cfg.optString("login", "").trim();
                              String password = cfg.optString("password", "").trim();
                              String intervalStr = cfg.optString("interval", "1");
                              String mode = cfg.optString("mode", "full_lesson");

                              double intervalMin = 1.0;
                              try {
                                  intervalMin = Double.parseDouble(intervalStr);
                              } catch (Exception ignored) {}

                              String today = new SimpleDateFormat("dd.MM.yyyy", Locale.US).format(new Date());
                              if (!today.equals(currentDayStamp)) {
                                  currentDayStamp = today;
                                  completedWindowsToday.clear();
                                  markedRaspIdsToday.clear();
                                  checkInTimeByStart.clear();
                              }

                              if (!isAuthenticated) {
                                  updateStatus("Подключение к lk.sut.ru...");
                                  if (!authenticate(login, password)) {
                                      updateStatus("Ошибка входа (проверьте логин/пароль)");
                                      sleepQuietly(20000L);
                                      continue;
                                  }
                                  WindowState initWin = getCurrentWindowState(mode);
                                  pollScheduleAndCheckIn(login, password, initWin != null ? initWin.startTime : null);
                              }

                              WindowState win = getCurrentWindowState(mode);

                              if (win == null) {
                                  String nextLesson = findNextUnmarkedLessonTime();
                                  if (nextLesson != null) {
                                      updateStatus("VPN активен • Ждем пару в " + nextLesson);
                                  } else {
                                      updateStatus("VPN активен • Ждем следующую пару");
                                  }
                                  sleepQuietly(25000L);
                                  continue;
                              }

                              if (completedWindowsToday.contains(win.startTime)) {
                                  String tMarked = checkInTimeByStart.get(win.startTime);
                                  String nextLesson = findNextLessonAfter(win.startTime);
                                  String waitText = nextLesson != null ? ("Спим до пары в " + nextLesson) : "Спим до след. пары";
                                  updateStatus("✅ Отмечен (" + (tMarked != null ? tMarked : "ОК") + ") • " + waitText);
                                  sleepQuietly(25000L);
                                  continue;
                              }

                              updateStatus("Ловим кнопку • " + win.label);
                              pollScheduleAndCheckIn(login, password, win.startTime);

                              if (completedWindowsToday.contains(win.startTime)) {
                                  String tMarked = checkInTimeByStart.get(win.startTime);
                                  updateStatus("✅ Отмечен (" + (tMarked != null ? tMarked : "ОК") + ") • Спим до след. пары");
                                  sleepQuietly(25000L);
                              } else {
                                  sleepQuietly(Math.max(15000L, (long) (intervalMin * 60000L)));
                              }
                          }
                      }
                  });
                  workerThread.start();
              }

              private void stopEngine() {
                  active = false;
                  serviceStartMillis = 0L;
                  statusText = "Отключено";
                  stopSilentAudioKeepAlive();
                  closeVpnTunnel();
                  if (wakeLock != null && wakeLock.isHeld()) {
                      wakeLock.release();
                  }
                  if (workerThread != null) {
                      workerThread.interrupt();
                  }
                  addLog("Автоотметка и VPN-движок ВЫКЛЮЧЕНЫ пользователем.");
                  saveStateFile();
                  stopForeground(true);
                  stopSelf();
              }

              private JSONObject readConfigFile() {
                  try {
                      File f = new File(getFilesDir(), "user_config_010203.json");
                      if (!f.exists()) return new JSONObject();
                      ByteArrayOutputStream baos = new ByteArrayOutputStream();
                      try (FileInputStream fis = new FileInputStream(f)) {
                          byte[] buf = new byte[2048];
                          int n;
                          while ((n = fis.read(buf)) != -1) baos.write(buf, 0, n);
                      }
                      return new JSONObject(new String(baos.toByteArray(), "UTF-8"));
                  } catch (Exception e) {
                      return new JSONObject();
                  }
              }

              private synchronized void saveStateFile() {
                  try {
                      File enabledFlag = new File(getFilesDir(), "engine_enabled.flag");
                      JSONObject obj = new JSONObject();
                      obj.put("active", active && enabledFlag.exists());
                      obj.put("status", statusText);
                      obj.put("startMillis", serviceStartMillis);
                      obj.put("defaultDayIdx", defaultNearestDayIdx);
                      obj.put("days", daysWeekArray);
                      obj.put("logs", new JSONArray(logs));
                      File f = new File(getFilesDir(), "bg_state_010203.json");
                      try (FileOutputStream fos = new FileOutputStream(f)) {
                          fos.write(obj.toString().getBytes("UTF-8"));
                      }
                  } catch (Exception ignored) {}
              }

              private synchronized void loadPersistedState() {
                  try {
                      File f = new File(getFilesDir(), "bg_state_010203.json");
                      if (!f.exists()) return;
                      ByteArrayOutputStream baos = new ByteArrayOutputStream();
                      try (FileInputStream fis = new FileInputStream(f)) {
                          byte[] buf = new byte[4096];
                          int n;
                          while ((n = fis.read(buf)) != -1) baos.write(buf, 0, n);
                      }
                      JSONObject obj = new JSONObject(new String(baos.toByteArray(), "UTF-8"));
                      daysWeekArray = obj.optJSONArray("days") != null ? obj.getJSONArray("days") : new JSONArray();
                      defaultNearestDayIdx = obj.optInt("defaultDayIdx", 0);
                      serviceStartMillis = obj.optLong("startMillis", 0L);
                      JSONArray lg = obj.optJSONArray("logs");
                      if (lg != null) {
                          logs.clear();
                          for (int i = 0; i < lg.length(); i++) logs.add(lg.getString(i));
                      }
                  } catch (Exception ignored) {}
              }

              private String findNextUnmarkedLessonTime() {
                  Calendar now = Calendar.getInstance();
                  int nowMins = now.get(Calendar.HOUR_OF_DAY) * 60 + now.get(Calendar.MINUTE);
                  Set<String> times = new HashSet<>(Arrays.asList(BELL_SCHEDULE));
                  synchronized (parsedTimes) {
                      times.addAll(parsedTimes);
                  }
                  String[] sorted = times.toArray(new String[0]);
                  Arrays.sort(sorted);
                  for (String t : sorted) {
                      if (completedWindowsToday.contains(t)) continue;
                      try {
                          String[] p = t.split(":");
                          int m = Integer.parseInt(p[0]) * 60 + Integer.parseInt(p[1]);
                          if (m > nowMins - 10) return t;
                      } catch (Exception ignored) {}
                  }
                  return null;
              }

              private String findNextLessonAfter(String currentStart) {
                  Set<String> times = new HashSet<>(Arrays.asList(BELL_SCHEDULE));
                  synchronized (parsedTimes) {
                      times.addAll(parsedTimes);
                  }
                  String[] sorted = times.toArray(new String[0]);
                  Arrays.sort(sorted);
                  for (String t : sorted) {
                      if (t.compareTo(currentStart) > 0) return t;
                  }
                  return null;
              }

              private void sleepQuietly(long ms) {
                  try {
                      Thread.sleep(ms);
                  } catch (InterruptedException ignored) {}
              }

              private void updateStatus(String newStatus) {
                  statusText = newStatus;
                  saveStateFile();
                  if (active) {
                      NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm != null) {
                          nm.notify(FG_NOTIFICATION_ID, buildForegroundNotification(newStatus));
                      }
                  }
              }

              private synchronized void addLog(String msg) {
                  String stamp = new SimpleDateFormat("HH:mm:ss", Locale.getDefault()).format(new Date());
                  logs.add("[" + stamp + "] " + msg);
                  if (logs.size() > 90) {
                      logs.remove(0);
                  }
              }

              private void createNotificationChannels() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm == null) return;
                      NotificationChannel bgChannel = new NotificationChannel(
                          CHANNEL_BG,
                          "VPN-движок Bonch AutoCheck",
                          NotificationManager.IMPORTANCE_LOW
                      );
                      nm.createNotificationChannel(bgChannel);

                      NotificationChannel alertChannel = new NotificationChannel(
                          CHANNEL_ALERT,
                          "Уведомления об отметке на паре",
                          NotificationManager.IMPORTANCE_HIGH
                      );
                      nm.createNotificationChannel(alertChannel);
                  }
              }

              private Notification buildForegroundNotification(String content) {
                  Intent notificationIntent = new Intent(this, MainActivity.class);
                  int flags = Build.VERSION.SDK_INT >= 23 ? PendingIntent.FLAG_IMMUTABLE : 0;
                  PendingIntent pendingIntent = PendingIntent.getActivity(this, 0, notificationIntent, flags);

                  Notification.Builder builder = Build.VERSION.SDK_INT >= 26
                      ? new Notification.Builder(this, CHANNEL_BG)
                      : new Notification.Builder(this);
                  builder.setContentTitle("Bonch VPN AutoCheck v" + APP_VERSION)
                         .setContentText(content)
                         .setSmallIcon(android.R.drawable.ic_lock_idle_lock)
                         .setContentIntent(pendingIntent)
                         .setOngoing(true);
                  return builder.build();
              }

              private void sendCheckInAlertNotification(String title, String message) {
                  try {
                      NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                      if (nm != null) {
                          Notification.Builder builder = Build.VERSION.SDK_INT >= 26
                              ? new Notification.Builder(this, CHANNEL_ALERT)
                              : new Notification.Builder(this);
                          builder.setContentTitle(title)
                                 .setContentText(message)
                                 .setSmallIcon(android.R.drawable.stat_sys_upload_done)
                                 .setAutoCancel(true);
                          nm.notify((int) (System.currentTimeMillis() % 100000), builder.build());
                      }
                  } catch (Exception ignored) {}
              }

              private String httpRequest(String method, String urlStr, String postBody) throws Exception {
                  URL url = new URL(urlStr);
                  HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                  conn.setRequestMethod(method);
                  conn.setConnectTimeout(15000);
                  conn.setReadTimeout(15000);
                  conn.setRequestProperty("User-Agent", "Mozilla/5.0 (Linux; Android 14; Mobile) Chrome/128.0.0.0 Mobile Safari/537.36");
                  conn.setRequestProperty("Referer", LOGIN_PAGE_URL);
                  conn.setRequestProperty("Origin", "https://lk.sut.ru");
                  conn.setRequestProperty("X-Requested-With", "XMLHttpRequest");

                  if ("POST".equals(method)) {
                      conn.setDoOutput(true);
                      conn.setRequestProperty("Content-Type", "application/x-www-form-urlencoded; charset=UTF-8");
                      byte[] out = (postBody != null ? postBody : "").getBytes("UTF-8");
                      try (OutputStream os = conn.getOutputStream()) {
                          os.write(out);
                      }
                  }

                  InputStream is = conn.getResponseCode() >= 400 ? conn.getErrorStream() : conn.getInputStream();
                  if (is == null) return "";
                  ByteArrayOutputStream baos = new ByteArrayOutputStream();
                  byte[] buf = new byte[4096];
                  int n;
                  while ((n = is.read(buf)) != -1) {
                      baos.write(buf, 0, n);
                  }
                  byte[] bytes = baos.toByteArray();
                  String utf8 = new String(bytes, Charset.forName("UTF-8"));
                  String lower = utf8.toLowerCase(Locale.ROOT);
                  if (lower.contains("расписание") || lower.contains("занят") || lower.contains("присутств") || lower.contains("понедельник") || lower.contains("вторник") || utf8.trim().equals("1")) {
                      return utf8;
                  }
                  String cp1251 = new String(bytes, Charset.forName("windows-1251"));
                  if (cp1251.toLowerCase(Locale.ROOT).contains("расписание") || cp1251.toLowerCase(Locale.ROOT).contains("занят")) {
                      return cp1251;
                  }
                  return utf8;
              }

              private synchronized boolean authenticate(String login, String password) {
                  try {
                      httpRequest("GET", LOGIN_PAGE_URL, null);
                      String data = "users=" + URLEncoder.encode(login, "UTF-8")
                                  + "&parole=" + URLEncoder.encode(password, "UTF-8");
                      String resp = httpRequest("POST", AUTH_URL + "?" + data, data);
                      if (resp.trim().equals("1") || resp.contains("1")) {
                          httpRequest("GET", INI_URL, null);
                          httpRequest("GET", LOGIN_PAGE_URL, null);
                          isAuthenticated = true;
                          addLog("Вход в ЛК выполнен (" + login + ")");
                          saveStateFile();
                          return true;
                      }
                      isAuthenticated = false;
                      addLog("Неверный логин или пароль от lk.sut.ru");
                      saveStateFile();
                      return false;
                  } catch (Exception e) {
                      isAuthenticated = false;
                      addLog("Ошибка сети: " + e.getMessage());
                      saveStateFile();
                      return false;
                  }
              }

              private boolean sendAndVerifyOpenZan(String raspId, String weekId) {
                  try {
                      String payload = "open=1&rasp=" + raspId + "&week=" + weekId;
                      httpRequest("POST", SCHEDULE_URL + "?" + payload, payload);
                      String verifyHtml = httpRequest("POST", SCHEDULE_URL, "").toLowerCase(Locale.ROOT);
                      return verifyHtml.contains("присутств")
                          || verifyHtml.contains("отмечен")
                          || verifyHtml.contains("занятие началось")
                          || !verifyHtml.contains("open_zan(" + raspId);
                  } catch (Exception e) {
                      return false;
                  }
              }

              private static class DayGroup {
                  String header;
                  Date dateObj;
                  List<JSONObject> lessons = new ArrayList<>();
                  boolean hasUnfinishedLessons = false;
              }

              private synchronized void pollScheduleAndCheckIn(String login, String password, String currentWindowStart) {
                  if (!isAuthenticated && !authenticate(login, password)) {
                      return;
                  }
                  try {
                      String html = httpRequest("POST", SCHEDULE_URL, "");
                      if (html.trim().length() < 50 || html.toLowerCase(Locale.ROOT).contains("autentification") || !html.toLowerCase(Locale.ROOT).contains("<table")) {
                          if (!authenticate(login, password)) return;
                          html = httpRequest("POST", SCHEDULE_URL, "");
                      }

                      Pattern trPattern = Pattern.compile("<tr[^>]*>(.*?)</tr>", Pattern.DOTALL | Pattern.CASE_INSENSITIVE);
                      Pattern dayHeaderPattern = Pattern.compile("(Понедельник|Вторник|Среда|Четверг|Пятница|Суббота|Воскресенье)[\\s\\S]*?(\\d{2}\\.\\d{2}\\.\\d{4})?", Pattern.CASE_INSENSITIVE);
                      Pattern timePattern = Pattern.compile("([01]?\\d|2[0-3])[:.]([0-5]\\d)\\s*[-–—]\\s*([01]?\\d|2[0-3])[:.]([0-5]\\d)");
                      Pattern zanPattern = Pattern.compile("open_zan\\s*\\(\\s*['\"]?(\\d+)['\"]?\\s*,\\s*['\"]?(\\d+)['\"]?\\s*\\)");
                      Pattern startedPattern = Pattern.compile("занятие\\s+началось\\s*(\\d{1,2}[:.]\\d{2})", Pattern.CASE_INSENSITIVE);

                      Matcher trMatcher = trPattern.matcher(html);
                      List<DayGroup> dayGroups = new ArrayList<>();
                      DayGroup currentGroup = null;
                      SimpleDateFormat df = new SimpleDateFormat("dd.MM.yyyy", Locale.US);
                      List<String> newlyChecked = new ArrayList<>();

                      Calendar nowCal = Calendar.getInstance();
                      int nowMinutesOfDay = nowCal.get(Calendar.HOUR_OF_DAY) * 60 + nowCal.get(Calendar.MINUTE);

                      while (trMatcher.find()) {
                          String trHtml = trMatcher.group(1);
                          String rowText = trHtml.replaceAll("<[^>]+>", " ")
                                                 .replaceAll("&nbsp;", " ")
                                                 .replaceAll("\\s+", " ")
                                                 .trim();
                          if (rowText.isEmpty()) continue;

                          Matcher tm = timePattern.matcher(rowText);
                          Matcher dm = dayHeaderPattern.matcher(rowText);

                          if (!tm.find()) {
                              if (dm.find() && rowText.length() < 60) {
                                  currentGroup = new DayGroup();
                                  String dayName = dm.group(1);
                                  String dateStr = dm.group(2);
                                  currentGroup.header = dateStr != null ? (dayName + " (" + dateStr + ")") : dayName;
                                  if (dateStr != null) {
                                      try {
                                          currentGroup.dateObj = df.parse(dateStr);
                                      } catch (Exception ignored) {}
                                  }
                                  dayGroups.add(currentGroup);
                              }
                              continue;
                          }

                          if (currentGroup == null) {
                              currentGroup = new DayGroup();
                              currentGroup.header = "Учебный день";
                              dayGroups.add(currentGroup);
                          }

                          String timeRange = tm.group(0);
                          int startH = Integer.parseInt(tm.group(1));
                          int startM = Integer.parseInt(tm.group(2));
                          int endH = Integer.parseInt(tm.group(3));
                          int endM = Integer.parseInt(tm.group(4));
                          String startTime = String.format(Locale.US, "%02d:%02d", startH, startM);
                          int endMinutesOfDay = endH * 60 + endM;

                          if (endMinutesOfDay >= nowMinutesOfDay) {
                              currentGroup.hasUnfinishedLessons = true;
                          }

                          Matcher zm = zanPattern.matcher(trHtml);
                          String raspId = null;
                          String weekId = null;
                          if (zm.find()) {
                              raspId = zm.group(1);
                              weekId = zm.group(2);
                          }

                          Matcher sm = startedPattern.matcher(rowText);
                          String startedAt = sm.find() ? sm.group(1) : null;

                          String lowerRow = rowText.toLowerCase(Locale.ROOT);
                          boolean alreadyInHtml = lowerRow.contains("вы присутствуете")
                                               || lowerRow.contains("отмечен")
                                               || lowerRow.contains("присутствует");

                          if (raspId != null && weekId != null && !alreadyInHtml && !markedRaspIdsToday.contains(raspId)) {
                              if (sendAndVerifyOpenZan(raspId, weekId)) {
                                  String nowStr = new SimpleDateFormat("HH:mm:ss", Locale.getDefault()).format(new Date());
                                  markedRaspIdsToday.add(raspId);
                                  checkInTimeByStart.put(startTime, nowStr);
                                  completedWindowsToday.add(startTime);
                                  alreadyInHtml = true;

                                  String cleanSubj = rowText.replace(timeRange, "").replaceFirst("^\\s*\\d+\\s*\\(\\s*\\)\\s*", "").trim();
                                  if (cleanSubj.length() > 65) cleanSubj = cleanSubj.substring(0, 65);
                                  newlyChecked.add(cleanSubj + " (отметка в " + nowStr + ")");
                              }
                          }

                          boolean hasTimeAppeared = (startedAt != null && raspId == null);
                          boolean isLessonDone = alreadyInHtml
                                              || hasTimeAppeared
                                              || (raspId != null && markedRaspIdsToday.contains(raspId));

                          String displayCheckTime = checkInTimeByStart.get(startTime);
                          if (displayCheckTime == null && startedAt != null) {
                              displayCheckTime = startedAt;
                          }
                          if (isLessonDone && displayCheckTime == null) {
                              displayCheckTime = new SimpleDateFormat("HH:mm", Locale.getDefault()).format(new Date());
                          }

                          if (isLessonDone && currentWindowStart != null && currentWindowStart.equals(startTime)) {
                              completedWindowsToday.add(startTime);
                              if (displayCheckTime != null) {
                                  checkInTimeByStart.put(startTime, displayCheckTime);
                              }
                          }

                          String cleanSubject = rowText
                              .replace(timeRange, "")
                              .replaceFirst("^\\s*\\d+\\s*\\(\\s*\\)\\s*", "")
                              .trim();
                          if (cleanSubject.length() > 100) {
                              cleanSubject = cleanSubject.substring(0, 100);
                          }

                          JSONObject item = new JSONObject();
                          item.put("time", timeRange);
                          item.put("startTime", startTime);
                          item.put("subject", cleanSubject);
                          item.put("checked", isLessonDone);
                          item.put("checkTime", displayCheckTime != null ? displayCheckTime : "");
                          currentGroup.lessons.add(item);
                      }

                      JSONArray allDaysJson = new JSONArray();
                      List<DayGroup> nonEmptyGroups = new ArrayList<>();
                      for (DayGroup g : dayGroups) {
                          if (!g.lessons.isEmpty()) {
                              nonEmptyGroups.add(g);
                              JSONObject dayObj = new JSONObject();
                              dayObj.put("title", g.header);
                              dayObj.put("lessons", new JSONArray(g.lessons));
                              allDaysJson.put(dayObj);
                          }
                      }
                      daysWeekArray = allDaysJson;
                      defaultNearestDayIdx = findNearestDayIndex(nonEmptyGroups);

                      if (!nonEmptyGroups.isEmpty()) {
                          DayGroup nearest = nonEmptyGroups.get(defaultNearestDayIdx);
                          synchronized (parsedTimes) {
                              parsedTimes.clear();
                              for (JSONObject les : nearest.lessons) {
                                  String st = les.optString("startTime", "");
                                  if (!st.isEmpty()) parsedTimes.add(st);
                              }
                          }
                      }

                      if (!newlyChecked.isEmpty()) {
                          String nowStr = new SimpleDateFormat("HH:mm:ss", Locale.getDefault()).format(new Date());
                          for (String s : newlyChecked) {
                              String title = "✅ Отметился на паре в " + nowStr + "!";
                              addLog(title + " — " + s);
                              sendCheckInAlertNotification(title, s);
                          }
                      } else {
                          addLog("Неделя обновлена (дней: " + allDaysJson.length() + ").");
                      }
                      saveStateFile();
                  } catch (Exception e) {
                      addLog("Ошибка опроса ЛК: " + e.getMessage());
                      saveStateFile();
                  }
              }

              private int findNearestDayIndex(List<DayGroup> groups) {
                  if (groups.isEmpty()) return 0;
                  Calendar cal = Calendar.getInstance();
                  cal.set(Calendar.HOUR_OF_DAY, 0);
                  cal.set(Calendar.MINUTE, 0);
                  cal.set(Calendar.SECOND, 0);
                  cal.set(Calendar.MILLISECOND, 0);
                  Date todayStart = cal.getTime();

                  for (int i = 0; i < groups.size(); i++) {
                      DayGroup g = groups.get(i);
                      if (g.dateObj != null) {
                          if (g.dateObj.equals(todayStart) && g.hasUnfinishedLessons) return i;
                          if (g.dateObj.after(todayStart)) return i;
                      }
                  }
                  for (int i = 0; i < groups.size(); i++) {
                      DayGroup g = groups.get(i);
                      if (g.dateObj != null && !g.dateObj.before(todayStart)) return i;
                  }
                  return 0;
              }

              private static class WindowState {
                  String startTime;
                  String label;
              }

              private WindowState getCurrentWindowState(String mode) {
                  int windowMin = "first_30".equals(mode) ? 30 : 95;
                  Set<String> allTimes = new HashSet<>(Arrays.asList(BELL_SCHEDULE));
                  synchronized (parsedTimes) {
                      allTimes.addAll(parsedTimes);
                  }
                  Calendar now = Calendar.getInstance();
                  long nowMillis = now.getTimeInMillis();
                  for (String t : allTimes) {
                      try {
                          String[] parts = t.replace(".", ":").split(":");
                          Calendar start = (Calendar) now.clone();
                          start.set(Calendar.HOUR_OF_DAY, Integer.parseInt(parts[0]));
                          start.set(Calendar.MINUTE, Integer.parseInt(parts[1]));
                          start.set(Calendar.SECOND, 0);
                          double diffMin = (nowMillis - start.getTimeInMillis()) / 60000.0;
                          if (diffMin >= -10.0 && diffMin <= windowMin) {
                              WindowState ws = new WindowState();
                              ws.startTime = String.format(Locale.US, "%02d:%02d", Integer.parseInt(parts[0]), Integer.parseInt(parts[1]));
                              ws.label = diffMin < 0
                                  ? ("Пара в " + ws.startTime + " (до начала " + Math.abs((int) diffMin) + " мин)")
                                  : ("Пара " + ws.startTime + " (идет " + (int) diffMin + " мин)");
                              return ws;
                          }
                      } catch (Exception ignored) {}
                  }
                  if ("always".equals(mode)) {
                      WindowState ws = new WindowState();
                      ws.startTime = "always_" + new SimpleDateFormat("HH", Locale.US).format(new Date());
                      ws.label = "Постоянный режим";
                      return ws;
                  }
                  return null;
              }
          }
