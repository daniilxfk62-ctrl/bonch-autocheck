name: Build Bonch APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.3"
          channel: "stable"

      - name: Install Flet and dependencies
        run: |
          pip install --upgrade pip
          pip install "flet==0.24.1" requests beautifulsoup4 plyer

      - name: Build APK
        run: |
          flet build apk --project "BonchAutoCheck" --description "Auto check-in for lk.sut.ru" --verbose

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BonchAutoCheck-APK
          path: build/apk/*.apk
