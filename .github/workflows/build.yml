                      + "  <button id='nav_2' class='tab-btn' onclick='switchTab(2)'><span style='font-size:18px;'>🤖</span><span>Умная отметка</span></button>"
                      + "</div>"

                      + "<script>"
                      + "var semesterDays=[];var catalogCache=[];var smartRules={};"
                      + "var todaySlideIdx=0;var currentSlideIdx=0;var activeTab=0;"
                      + "var lastDaysMtime=-1;var lastCatMtime=-1;var initialJumpDone=false;"
                      + "var verTapCount=0;var verTapTimer=null;var devOpen=false;"

                      + "function switchTab(idx){"
                      + "  activeTab=idx;"
                      + "  document.getElementById('tab_main').style.display=idx===0?'block':'none';"
                      + "  document.getElementById('tab_schedule').style.display=idx===1?'block':'none';"
                      + "  document.getElementById('tab_robot').style.display=idx===2?'block':'none';"
                      + "  document.getElementById('nav_0').className=idx===0?'tab-btn active':'tab-btn';"
                      + "  document.getElementById('nav_1').className=idx===1?'tab-btn active':'tab-btn';"
                      + "  document.getElementById('nav_2').className=idx===2?'tab-btn active':'tab-btn';"
                      + "  if(idx===1){"
                      + "    renderTikTokSchedule();"
                      + "    if(!initialJumpDone){setTimeout(function(){jumpToSlide(todaySlideIdx,false);initialJumpDone=true;},60);}"
                      + "    else{updateSidebarAndTodayBtn();}"
                      + "  }"
                      + "  if(idx===2)renderSmartCatalog();"
                      + "}"

                      + "function onVerTap(){"
                      + "  verTapCount++;"
                      + "  if(verTapTimer)clearTimeout(verTapTimer);"
                      + "  if(verTapCount>=5){"
                      + "    verTapCount=0;"
                      + "    devOpen=!devOpen;"
                      + "    document.getElementById('dev_panel').style.display=devOpen?'block':'none';"
                      + "    document.getElementById('ver_box').innerText=devOpen?'Версия: 01.03.01 (Dev ON)':'Версия: 01.03.01';"
                      + "  }else{"
                      + "    verTapTimer=setTimeout(function(){verTapCount=0;},1500);"
                      + "  }"
                      + "}"

                      + "function val(id){return document.getElementById(id).value;}"
                      + "function initApp(){"
                      + "  try{"
                      + "    var c=JSON.parse(AndroidBridge.getSavedConfig());"
                      + "    if(c.login!==undefined)document.getElementById('login').value=c.login;"
                      + "    if(c.password!==undefined)document.getElementById('password').value=c.password;"
                      + "    if(c.interval)document.getElementById('interval').value=c.interval;"
                      + "    if(c.mode)document.getElementById('mode').value=c.mode;"
                      + "    smartRules=JSON.parse(AndroidBridge.getSmartRules()||'{}');"
                      + "    semesterDays=JSON.parse(AndroidBridge.getCachedSemesterDays()||'[]');"
                      + "    catalogCache=JSON.parse(AndroidBridge.getCachedSmartCatalog()||'[]');"
                      + "  }catch(e){}"
                      + "}"

                      + "function isRuleOn(key){return smartRules[key]===undefined?true:Boolean(smartRules[key]);}"
                      + "function toggleSubjectType(subj,type){"
                      + "  var key=subj+'||'+type;"
                      + "  smartRules[key]=!isRuleOn(key);"
                      + "  AndroidBridge.saveSmartRules(JSON.stringify(smartRules));"
                      + "  renderSmartCatalog();"
                      + "  if(semesterDays.length)renderTikTokSchedule();"
                      + "}"
                      + "function bulkSetRules(state){"
                      + "  var types=['Лекция','Практика','Лаба'];"
                      + "  for(var i=0;i<catalogCache.length;i++){"
                      + "    var s=catalogCache[i].subject;"
                      + "    for(var t=0;t<types.length;t++)smartRules[s+'||'+types[t]]=state;"
                      + "  }"
                      + "  AndroidBridge.saveSmartRules(JSON.stringify(smartRules));"
                      + "  renderSmartCatalog();"
                      + "}"
                      + "function onlyPracticeAndLabs(){"
                      + "  for(var i=0;i<catalogCache.length;i++){"
                      + "    var s=catalogCache[i].subject;"
                      + "    smartRules[s+'||Лекция']=false;"
                      + "    smartRules[s+'||Практика']=true;"
                      + "    smartRules[s+'||Лаба']=true;"
                      + "  }"
                      + "  AndroidBridge.saveSmartRules(JSON.stringify(smartRules));"
                      + "  renderSmartCatalog();"
                      + "}"

                      // РЕНДЕР ВКЛАДКИ УМНОЙ ОТМЕТКИ (3 КНОПКИ В ОДИН РЯД БЕЗ КАБИНЕТОВ)
                      + "function renderSmartCatalog(){"
                      + "  var statEl=document.getElementById('smart_stats');"
                      + "  var listEl=document.getElementById('smart_list');"
                      + "  if(!catalogCache || !catalogCache.length){"
                      + "    statEl.innerHTML='Расписание семестра еще не в кэше.<br>Нажмите кнопку ниже один раз — оно сохранится навсегда.';"
                      + "    listEl.innerHTML='';"
                      + "    return;"
                      + "  }"
                      + "  var totalPairs=0;"
                      + "  for(var i=0;i<catalogCache.length;i++)totalPairs+=(catalogCache[i].total||0);"
                      + "  statEl.innerHTML='📚 <b>Предметов в семестре:</b> '+catalogCache.length"
                      + "    +'<br>📊 <b>Всего пар за полгода:</b> '+totalPairs+' (сохранено в памяти телефона)';"
                      + "  var h='';"
                      + "  for(var j=0;j<catalogCache.length;j++){"
                      + "    var it=catalogCache[j];"
                      + "    var sName=it.subject||'Предмет';"
                      + "    var safeSubj=sName.replace(/'/g,\"\\\\'\").replace(/\"/g,'&quot;');"
                      + "    var lOn=isRuleOn(sName+'||Лекция');"
                      + "    var pOn=isRuleOn(sName+'||Практика');"
                      + "    var bOn=isRuleOn(sName+'||Лаба');"
                      + "    h+=\"<div class='subj-group'>\""
                      + "      +\"<div class='subj-hdr'><span>\"+sName+\"</span><span style='font-size:11px;color:#fb923c;white-space:nowrap;'>\"+(it.total||0)+\" пар</span></div>\""
                      + "      +\"<div style='font-size:11px;color:#94a3b8;'>👤 \"+(it.teachers||'Не указан')+\"</div>\""
                      + "      +\"<div class='type-grid'>\""
                      + "        +\"<div class='type-btn \"+(lOn?'on':'')+\" \"+((it.lecCount||0)===0?'zero':'')+\"' onclick=\\\"toggleSubjectType('\"+safeSubj+\"','Лекция')\\\">\""
                      + "          +\"<span>\"+(lOn?'☑':'☐')+\" Лекция</span><span style='font-size:10px;'>\"+(it.lecCount||0)+\" пар</span></div>\""
                      + "        +\"<div class='type-btn \"+(pOn?'on':'')+\" \"+((it.pracCount||0)===0?'zero':'')+\"' onclick=\\\"toggleSubjectType('\"+safeSubj+\"','Практика')\\\">\""
                      + "          +\"<span>\"+(pOn?'☑':'☐')+\" Практика</span><span style='font-size:10px;'>\"+(it.pracCount||0)+\" пар</span></div>\""
                      + "        +\"<div class='type-btn \"+(bOn?'on':'')+\" \"+((it.labCount||0)===0?'zero':'')+\"' onclick=\\\"toggleSubjectType('\"+safeSubj+\"','Лаба')\\\">\""
                      + "          +\"<span>\"+(bOn?'☑':'☐')+\" Лаба</span><span style='font-size:10px;'>\"+(it.labCount||0)+\" пар</span></div>\""
                      + "      +\"</div></div>\";"
                      + "  }"
                      + "  listEl.innerHTML=h;"
                      + "}"

                      // РЕНДЕР TIKTOK-ЛЕНТЫ РАСПИСАНИЯ И БОКОВОЙ ПАНЕЛИ НА 7 ДНЕЙ
                      + "function renderTikTokSchedule(){"
                      + "  var feed=document.getElementById('tiktok_feed');"
                      + "  if(!semesterDays || !semesterDays.length){"
                      + "    feed.innerHTML=\"<div class='day-slide'><div class='slide-hdr'><b>Расписание пусто</b></div><div style='color:#94a3b8;font-size:13px;'>Нажмите «ВКЛЮЧИТЬ АВТООТМЕТКУ» на Главной или загрузите семестр во вкладке 🤖.</div></div>\";"
                      + "    document.getElementById('week_sidebar').innerHTML='';"
                      + "    return;"
                      + "  }"
                      + "  var h='';"
                      + "  for(var i=0;i<semesterDays.length;i++){"
                      + "    var d=semesterDays[i];"
                      + "    var isToday=(i===todaySlideIdx);"
                      + "    var wBadge=d.weekNum?('Неделя '+d.weekNum):'Текущая неделя';"
                      + "    var tBadge=isToday?\" <span style='color:#34d399;'>• СЕГОДНЯ</span>\":'';"
                      + "    h+=\"<div class='day-slide' id='slide_\"+i+\"'>\""
                      + "      +\"<div class='slide-hdr'><div><div style='font-size:15px;font-weight:900;color:#fb923c;'>\"+d.title+tBadge+\"</div>\""
                      + "      +\"<div style='font-size:11px;color:#94a3b8;margin-top:2px;'>\"+wBadge+\" • Листайте вверх/вниз ↕</div></div></div>\""
                      + "      +\"<div class='slide-body'>\";"
                      + "    var list=d.lessons||[];"
                      + "    if(!list.length){"
                      + "      h+=\"<div style='background:#111827;border:1px solid #1e293b;border-radius:14px;padding:24px;text-align:center;color:#94a3b8;font-size:13px;margin-top:20px;'>🎉 Пар нет • Выходной день</div>\";"
                      + "    }else{"
                      + "      for(var k=0;k<list.length;k++){"
                      + "        var x=list[k];"
                      + "        var allowed=x.ruleKey?isRuleOn(x.ruleKey):true;"
                      + "        var cls=!allowed?'item skip':(x.checked?'item done':'item');"
                      + "        var c=!allowed?'#f87171':(x.checked?'#34d399':'#fb923c');"
                      + "        var waitHint=x.waitBtnTime?(' (кнопка в '+x.waitBtnTime+')'):'';"
                      + "        var st=!allowed?'🚫 Выключено в 🤖':(x.checked?('✅ Отмечен ('+(x.checkTime||'ОК')+')'):('⏳ Ждем кнопку'+waitHint));"
                      + "        h+=\"<div class='\"+cls+\"'><b style='color:\"+c+\"'>\"+x.time+\" — \"+st+\"</b><br><span style='color:#e2e8f0;font-weight:700;'>\"+(x.subjectTitle||x.subject)+\"</span>\""
                      + "          +\"<div style='font-size:11px;color:#94a3b8;margin-top:3px;'>\"+(x.lessonType||'')+(x.teacher?(' • '+x.teacher):'')+\"</div></div>\";"
                      + "      }"
                      + "    }"
                      + "    h+=\"</div></div>\";"
                      + "  }"
                      + "  feed.innerHTML=h;"
                      + "  updateSidebarAndTodayBtn();"
                      + "}"

                      + "function onFeedScroll(){"
                      + "  var feed=document.getElementById('tiktok_feed');"
                      + "  var h=feed.clientHeight;"
                      + "  if(h<=0)return;"
                      + "  var idx=Math.round(feed.scrollTop/h);"
                      + "  if(idx<0)idx=0;"
                      + "  if(idx>=semesterDays.length)idx=semesterDays.length-1;"
                      + "  if(idx!==currentSlideIdx){"
                      + "    currentSlideIdx=idx;"
                      + "    updateSidebarAndTodayBtn();"
                      + "  }"
                      + "}"

                      + "function updateSidebarAndTodayBtn(){"
                      + "  var btnToday=document.getElementById('btn_today');"
                      + "  if(activeTab===1 && semesterDays.length>0 && currentSlideIdx!==todaySlideIdx){"
                      + "    btnToday.style.display='block';"
                      + "  }else{"
                      + "    btnToday.style.display='none';"
                      + "  }"
                      + "  var sb=document.getElementById('week_sidebar');"
                      + "  if(!semesterDays.length){sb.innerHTML='';return;}"
                      + "  var curDay=semesterDays[currentSlideIdx]||semesterDays[0];"
                      + "  var curDow=curDay.dowIdx||0;"
                      + "  var mondaySlideIdx=currentSlideIdx-curDow;"
                      + "  var sh='';"
                      + "  var shortNames=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];"
                      + "  for(var d=0;d<7;d++){"
                      + "    var targetIdx=mondaySlideIdx+d;"
                      + "    if(targetIdx>=0 && targetIdx<semesterDays.length){"
                      + "      var dayItem=semesterDays[targetIdx];"
                      + "      var isAct=(targetIdx===currentSlideIdx);"
                      + "      var isTod=(targetIdx===todaySlideIdx);"
                      + "      var cls='side-day-btn'+(isAct?' active':'')+(isTod?' today-ring':'');"
                      + "      sh+=\"<button class='\"+cls+\"' onclick='jumpToSlide(\"+targetIdx+\",true)'>\""
                      + "        +\"<span>\"+shortNames[d]+\"</span><span style='font-size:9px;opacity:0.85;'>\"+(dayItem.shortDate||'')+\"</span></button>\";"
                      + "    }"
                      + "  }"
                      + "  sb.innerHTML=sh;"
                      + "}"

                      + "function jumpToSlide(idx,smooth){"
                      + "  if(!semesterDays.length)return;"
                      + "  if(idx<0)idx=0;"
                      + "  if(idx>=semesterDays.length)idx=semesterDays.length-1;"
                      + "  currentSlideIdx=idx;"
                      + "  var feed=document.getElementById('tiktok_feed');"
                      + "  var targetTop=idx*feed.clientHeight;"
                      + "  feed.scrollTo({top:targetTop,behavior:smooth?'smooth':'auto'});"
                      + "  updateSidebarAndTodayBtn();"
                      + "}"

                      + "function jumpToToday(){jumpToSlide(todaySlideIdx,true);}"
                      + "function saveCfg(){AndroidBridge.saveSettingsOnly(val('login'),val('password'),val('interval'),val('mode'));}"
                      + "function toggle(){AndroidBridge.toggleAutoCheck(val('login'),val('password'),val('interval'),val('mode'));setTimeout(poll,400);}"
                      + "function checkNow(){AndroidBridge.checkNow(val('login'),val('password'),val('interval'),val('mode'));setTimeout(poll,700);}"
                      + "function scanSemester(){AndroidBridge.scanSemesterNow(val('login'),val('password'),val('interval'),val('mode'));setTimeout(poll,500);}"

                      + "function poll(){"
                      + "  try{"
                      + "    var d=JSON.parse(AndroidBridge.getState());"
                      + "    var b=document.getElementById('btn');"
                      + "    var s=document.getElementById('status');"
                      + "    var sb=document.getElementById('status_box');"
                      + "    var u=document.getElementById('uptime');"
                      + "    if(d.active){"
                      + "      b.className='btn on';"
                      + "      b.innerText='ВЫКЛЮЧИТЬ АВТООТМЕТКУ';"
                      + "      sb.className='status-card on';"
                      + "      s.style.color='#34d399';"
                      + "      if(d.startMillis && d.startMillis>0){"
                      + "        var sec=Math.floor((Date.now()-d.startMillis)/1000);"
                      + "        var m=Math.floor(sec/60);var rs=sec%60;"
                      + "        u.innerText='Аптайм: '+m+'м '+rs+'с';"
                      + "      }"
                      + "    }else{"
                      + "      b.className='btn';"
                      + "      b.innerText='ВКЛЮЧИТЬ АВТООТМЕТКУ';"
                      + "      sb.className='status-card';"
                      + "      s.style.color='#94a3b8';"
                      + "      u.innerText='Остановлено';"
                      + "    }"
                      + "    s.innerText=d.scanningSemester?(d.scanStatus||'Анализ семестра...'):(d.status||'Отключено');"
                      + "    if(d.logs)document.getElementById('logs').innerText=d.logs.join('\\n');"
                      + "    if(d.todayDayIdx!==undefined)todaySlideIdx=d.todayDayIdx||0;"
                      + "    if(d.daysMtime && d.daysMtime!==lastDaysMtime){"
                      + "      lastDaysMtime=d.daysMtime;"
                      + "      semesterDays=JSON.parse(AndroidBridge.getCachedSemesterDays()||'[]');"
                      + "      if(activeTab===1)renderTikTokSchedule();"
                      + "    }"
                      + "    if(d.catMtime && d.catMtime!==lastCatMtime){"
                      + "      lastCatMtime=d.catMtime;"
                      + "      catalogCache=JSON.parse(AndroidBridge.getCachedSmartCatalog()||'[]');"
                      + "      if(activeTab===2)renderSmartCatalog();"
                      + "    }"
                      + "    if(d.scanningSemester && d.scanStatus && activeTab===2){"
                      + "      document.getElementById('smart_stats').innerText='🔄 '+d.scanStatus;"
                      + "    }"
                      + "  }catch(e){}"
                      + "}"
                      + "initApp();setInterval(poll,1500);poll();"
                      + "</script></body></html>";
              }
          }
          EOF

          sed -i 's/^[[:space:]]*//' res/values/strings.xml AndroidManifest.xml

          "$BUILD_TOOLS/aapt2" compile --dir res -o build/res.zip
          "$BUILD_TOOLS/aapt2" link -o build/unaligned.apk \
            -I "$ANDROID_JAR" \
            --manifest AndroidManifest.xml \
            --java build/gen \
            build/res.zip

          javac -encoding UTF-8 -source 8 -target 8 \
            -bootclasspath "$ANDROID_JAR" \
            -cp "$ANDROID_JAR" \
            -d build/obj \
            build/gen/ru/sut/bonch/R.java \
            src/ru/sut/bonch/BootReceiver.java \
            src/ru/sut/bonch/BonchBackgroundDaemon.java \
            src/ru/sut/bonch/MainActivity.java

          "$BUILD_TOOLS/d8" --lib "$ANDROID_JAR" --output build/ build/obj/ru/sut/bonch/*.class

          zip -uj build/unaligned.apk build/classes.dex

          "$BUILD_TOOLS/zipalign" -f -p 4 build/unaligned.apk build/aligned.apk

          keytool -genkeypair -v \
            -keystore build/release.keystore \
            -storepass android -keypass android \
            -alias bonchkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=BonchAutoCheck,OU=IT,O=SUT,L=SPb,S=SPb,C=RU"

          "$BUILD_TOOLS/apksigner" sign \
            --ks build/release.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out build/apk/BonchAutoCheck-01.03.01.apk \
            build/aligned.apk

          ls -lh build/apk/BonchAutoCheck-01.03.01.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BonchAutoCheck-01.03.01-APK
          path: build/apk/BonchAutoCheck-01.03.01.apk

      - name: Publish Direct APK to GitHub Releases
        if: always()
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v01.03.01
          name: "Bonch AutoCheck v01.03.01"
          files: build/apk/BonchAutoCheck-01.03.01.apk
