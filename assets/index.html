<style>
  * { -webkit-tap-highlight-color: transparent; }
  body { margin:0; background:#090d16; color:#f8fafc; font-family:system-ui,-apple-system,sans-serif; overflow-x:hidden; }
  .page-pad { padding:12px 12px 76px 12px; }
  .card { background:#111827; border:1px solid #1e293b; border-radius:20px; padding:16px; max-width:460px; margin:0 auto; }
  .section-box { background:#0f172a; border:1px solid #1e293b; border-radius:16px; padding:14px; margin-bottom:12px; }
  .section-title { font-size:13px; font-weight:900; color:#fb923c; margin-bottom:8px; display:flex; align-items:center; gap:6px; text-transform:uppercase; letter-spacing:0.4px; }
  .lbl { font-size:11px; color:#94a3b8; margin-top:4px; display:block; }
  input, select { width:100%; box-sizing:border-box; padding:11px; margin:4px 0 10px; border-radius:10px; border:1px solid #334155; background:#1e293b; color:#fff; font-size:14px; outline:none; }
  .btn { width:100%; padding:15px; border-radius:12px; border:none; background:#2563eb; color:#fff; font-weight:800; font-size:15px; margin-top:6px; }
  .btn.on { background:#dc2626; }
  .btn-once { width:100%; padding:13px; border-radius:12px; border:1px solid #f59e0b; background:linear-gradient(135deg,#78350f 0%,#451a03 100%); color:#fde68a; font-weight:800; font-size:13px; margin-top:8px; }
  .btn-once.on { background:#dc2626; border-color:#f87171; color:#fff; }
  .btn-sec { width:100%; padding:11px; border-radius:12px; border:1px solid #334155; background:#1e293b; color:#cbd5e1; font-weight:600; font-size:12px; margin-top:7px; }
  .status-card { margin:12px 0 6px; padding:12px 14px; background:#0f172a; border:1px solid #334155; border-left:4px solid #64748b; border-radius:12px; }
  .status-card.on { border-left-color:#34d399; background:#06281e; border-color:#059669; }
  .status-title { font-size:11px; color:#94a3b8; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:4px; font-weight:700; }
  .status-val { font-size:14px; font-weight:800; color:#f8fafc; line-height:1.35; }
  .profile-pill { display:flex; justify-content:space-between; align-items:center; background:#0f172a; border:1px solid #1e293b; border-radius:12px; padding:10px 12px; margin-bottom:10px; font-size:12px; color:#cbd5e1; cursor:pointer; }
  .dev-panel { display:none; margin-top:12px; padding:12px; background:#090d16; border:1px dashed #f97316; border-radius:12px; }
  .dev-hdr { font-size:11px; font-weight:800; color:#f97316; margin-bottom:6px; display:flex; justify-content:space-between; }
  .log { background:#05080f; border:1px solid #1e293b; border-radius:8px; padding:8px; font-family:monospace; font-size:11px; height:120px; overflow-y:auto; white-space:pre-wrap; color:#cbd5e1; }
